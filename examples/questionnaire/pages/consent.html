<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Consent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Information and consent</h1>
  <p>Hello participant <b>{{participant}}</b>. This study takes about 10 minutes.
     You may stop at any time by pressing Escape.</p>
  <form>
    <label><input type="checkbox" name="agree" value="yes" required> I have read the information and agree to take part.</label>
    <p><button type="submit">Continue</button></p>
  </form>
</body>
</html>
