# EXPERIMENTAL: builds stand-alone EDGE apps with PyInstaller when a version tag (v*) is pushed.
# Not yet verified on every OS; the pip / installer-script route is the supported one.
name: Release apps
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]" pyinstaller
      - run: pyinstaller install/edge.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: EDGE-${{ matrix.os }}
          path: dist/EDGE
