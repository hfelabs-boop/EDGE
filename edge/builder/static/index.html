<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDGE Builder</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="logo">◆</span> EDGE <span class="sub">builder</span></div>
  <div class="file">
    <span id="filename">untitled</span><span id="dirty" title="unsaved changes"></span>
  </div>
  <nav class="actions">
    <button id="btn-new" title="New from template">New</button>
    <button id="btn-open" title="Open experiment">Open</button>
    <button id="btn-import" title="Import a PsychoPy, E-Prime, OpenSesame or jsPsych experiment">Import</button>
    <button id="btn-save" title="Save (Ctrl+S)">Save</button>
    <button id="btn-versions" title="Saved versions (automatic backups)">Versions</button>
    <button id="btn-bundle" title="Download the experiment with all its files (.edgez)">Bundle</button>
    <span class="sep"></span>
    <button id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
    <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">↷</button>
    <span class="sep"></span>
    <button id="btn-settings" title="Experiment settings">Settings</button>
    <button id="btn-validate" title="Check for errors">Validate</button>
    <button id="btn-dryrun" class="accent" title="Run headless with simulated devices and a virtual participant">▶ Dry run</button>
    <button id="btn-run" class="primary" title="Run for real (opens the experiment window)">▶ Run</button>
    <button id="btn-help" title="How EDGE works (?)">?</button>
  </nav>
</header>

<main id="layout">
  <aside id="left">
    <section>
      <h3>Components</h3>
      <input id="palette-filter" placeholder="filter…">
      <div id="palette"></div>
    </section>
    <section>
      <h3>Devices <button class="mini" id="btn-add-device" title="Add device">+</button></h3>
      <div id="devices"></div>
      <button class="wide" id="btn-scan">Scan for hardware</button>
    </section>
  </aside>

  <section id="center">
    <div id="routine-area">
      <div id="routine-tabs"></div>
      <div id="routine-body">
        <div id="timeline"></div>
        <div id="preview-wrap">
          <div class="preview-stack">
            <canvas id="preview" width="480" height="270"></canvas>
            <iframe id="preview-html" class="hidden" title="HTML page preview" sandbox="allow-scripts allow-forms"></iframe>
          </div>
          <div class="preview-ctl">
            <input type="range" id="preview-t" min="0" max="5" step="0.01" value="0">
            <span id="preview-label">t = 0.00 s</span>
          </div>
        </div>
      </div>
    </div>
    <div id="flow-area">
      <h3>Flow</h3>
      <div id="flow"></div>
    </div>
    <div id="console">
      <div class="tabs">
        <button data-tab="issues" class="active">Issues <span id="issue-count"></span></button>
        <button data-tab="results">Dry-run results</button>
        <button data-tab="source">Source (YAML)</button>
        <button data-tab="hardware">Hardware</button>
        <button data-tab="data">Data</button>
      </div>
      <div id="tab-issues" class="tab active"></div>
      <div id="tab-results" class="tab"></div>
      <div id="tab-source" class="tab">
        <textarea id="yaml" spellcheck="false"></textarea>
        <button id="btn-apply-yaml">Apply YAML</button>
      </div>
      <div id="tab-hardware" class="tab"></div>
      <div id="tab-data" class="tab"></div>
    </div>
  </section>

  <aside id="right">
    <h3 id="props-title">Properties</h3>
    <div id="props"></div>
  </aside>
</main>

<div id="modal" class="hidden"><div class="modal-box"><div id="modal-body"></div></div></div>
<div id="toast"></div>
<div id="banner" class="hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
