<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDGE Builder</title>
<link rel="icon" type="image/svg+xml" href="/assets/edge-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/edge-32.png">
<link rel="apple-touch-icon" href="/assets/edge-128.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><img class="logo-img" src="/assets/edge-48.png" alt="" width="26" height="26"> EDGE <span class="sub">builder</span></div>
  <div class="file">
    <span id="filename">untitled</span><span id="dirty" title="unsaved changes"></span>
  </div>
  <nav class="actions">
    <button id="btn-new" title="Start a new experiment: guided questions, templates, or import">New</button>
    <button id="btn-open" title="Open experiment">Open</button>
    <button id="btn-import" class="expert-only" title="Import a PsychoPy, E-Prime, OpenSesame or jsPsych experiment">Import</button>
    <button id="btn-save" title="Save (Ctrl+S)">Save</button>
    <button id="btn-versions" class="expert-only" title="Saved versions (automatic backups)">Versions</button>
    <button id="btn-bundle" class="expert-only" title="Download the experiment with all its files (.edgez)">Bundle</button>
    <span class="sep"></span>
    <button id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
    <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">↷</button>
    <span class="sep"></span>
    <button id="btn-measures" title="What this experiment measures, and everything it records">Measures &amp; data</button>
    <button id="btn-settings" title="Experiment settings: window, colours, data">Settings</button>
    <button id="btn-validate" title="Check the experiment for mistakes">Check</button>
    <button id="btn-dryrun" title="Test run: a virtual participant does the whole experiment in seconds (simulated hardware)">▶ Test run</button>
    <button id="btn-try" class="accent" title="Try it yourself, right here: press the keys and click like a participant">▶ Try it</button>
    <button id="btn-run" class="primary" title="Run with a participant: opens the experiment window and records data">Run with a participant</button>
    <span class="sep"></span>
    <button id="btn-mode" title="Simple shows the essentials; Expert shows every option">Simple</button>
    <button id="btn-help" title="Help, tutorials and documentation (?)">?</button>
  </nav>
</header>

<main id="layout">
  <aside id="left">
    <section>
      <h3>Add to this screen</h3>
      <input id="palette-filter" placeholder="search…">
      <div id="palette"></div>
    </section>
    <section>
      <h3>Devices <button class="mini" id="btn-add-device" title="Add an eye tracker, EEG, physiology, LSL or trigger device">+</button></h3>
      <div id="devices"></div>
      <button class="wide expert-only" id="btn-scan">Scan for hardware</button>
    </section>
  </aside>

  <section id="center">
    <div id="routine-area">
      <div id="routine-tabs"></div>
      <div id="routine-body">
        <div id="timeline"></div>
        <div id="preview-wrap">
          <div class="preview-stack">
            <canvas id="preview" width="480" height="270"></canvas>
            <iframe id="preview-html" class="hidden" title="HTML page preview" sandbox="allow-scripts allow-forms"></iframe>
          </div>
          <div class="preview-ctl">
            <button id="preview-play" class="mini" title="Play this screen at real speed">▶</button>
            <input type="range" id="preview-t" min="0" max="5" step="0.01" value="0">
            <span id="preview-label">t = 0.00 s</span>
            <button id="preview-big" class="mini" title="Bigger preview, for arranging things on the screen">⤢</button>
          </div>
          <div id="stage-hint" class="help">Click something to select it · drag to move · corners resize · ◯ rotates · double-click text to type · arrow keys nudge · drop pictures or sounds here</div>
        </div>
      </div>
    </div>
    <div id="flow-area">
      <h3>Flow <span class="flow-hint">the order of screens: + inserts, drag to move</span></h3>
      <div id="flow"></div>
    </div>
    <div id="console">
      <div class="tabs">
        <button data-tab="issues" class="active">Check <span id="issue-count"></span></button>
        <button data-tab="results">Test results</button>
        <button data-tab="source" class="expert-only">Source (YAML)</button>
        <button data-tab="hardware" class="expert-only">Hardware</button>
        <button data-tab="data">Data</button>
      </div>
      <div id="tab-issues" class="tab active"></div>
      <div id="tab-results" class="tab"></div>
      <div id="tab-source" class="tab">
        <textarea id="yaml" spellcheck="false"></textarea>
        <button id="btn-apply-yaml">Apply YAML</button>
      </div>
      <div id="tab-hardware" class="tab"></div>
      <div id="tab-data" class="tab"></div>
    </div>
  </section>

  <aside id="right">
    <h3 id="props-title">Properties</h3>
    <div id="props"></div>
  </aside>
</main>

<div id="modal" class="hidden"><div class="modal-box"><div id="modal-body"></div></div></div>
<div id="toast"></div>
<div id="banner" class="hidden"></div>
<div id="play" class="hidden"></div>
<script src="/static/app.js"></script>
<script src="/static/simple.js"></script>
<script src="/static/survey.js"></script>
<script src="/static/stage.js"></script>
<script src="/static/measures.js"></script>
</body>
</html>
