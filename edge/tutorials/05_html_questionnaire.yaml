id: html_questionnaire
order: 5
title: Questionnaires and consent with HTML pages
level: beginner
minutes: 7
learn: html component, forms, saved answers, placeholders
description: >
  Put a real HTML form inside your experiment: every answer is saved as a data column, and dry runs
  fill the form in automatically.
start: tutorial_empty
steps:
  - title: Create a routine for the questionnaire
    body: |
      Click **+ routine** and name it `survey`.
    target: ".rtab.add"
    check: {routine_exists: survey}
  - title: Add an HTML page
    body: |
      Click **html** in the palette. HTML pages can show consent forms, questionnaires, rich
      instructions, or even complete JavaScript tasks.
    target: ".pal-item[data-type=html]"
    check: {component: {routine: survey, type: html}}
  - title: Write the form
    body: |
      In Properties, paste this into **html** (or use **file** to point at an `.html` file):

      ```html
      <h2>How do you feel?</h2>
      <form>
        <label><input type="radio" name="mood" value="1" required> bad</label>
        <label><input type="radio" name="mood" value="2"> okay</label>
        <label><input type="radio" name="mood" value="3"> great</label>
        <p>Age <input type="number" name="age" min="18" max="99"></p>
        <button>Continue</button>
      </form>
      ```

      The preview shows the real page.
    target: "#props"
    check: {component: {routine: survey, type: html, prop: html, contains: "<form"}}
  - title: End the routine when the form is sent
    body: |
      Tick **end_routine** in the component's Timing section.
    target: "#props"
    check: {component: {routine: survey, type: html, prop: end_routine, value: true}}
  - title: Put it in the flow
    body: |
      In the **Flow** strip click **+** and choose **Routine: survey**.
    target: "#flow"
    check: {flow_has: survey}
  - title: Dry run and see the answers
    body: |
      Run a **dry run**. The virtual participant fills in the form, and the data preview has the columns
      `html.mood` and `html.age`. In real sessions, answers land in exactly the same place.

      Tip: write `{{participant}}` or any trial variable in the HTML to show it on the page.
    target: "#btn-dryrun"
    check: {dry_run: true}
