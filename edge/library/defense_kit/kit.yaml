# The defence kit's index, written by tools/library/make_defense_kit.py (do not edit by hand: re-run it).
about: 'Shared stimulus kit of EDGE''s operational (defence human-factors) task adaptations. Everything is synthetic
  and generic: drawn by tools/library/make_defense_kit.py (re-run it to make the kit again). Copy the files a task
  needs into its own stimuli/ folder. See docs/library/DEFENSE.md.'
generator: tools/library/make_defense_kit.py
themes:
  c2: 'Command and control: tactical plot / map with track symbols, a message panel and alerts'
  uav: 'UAV payload operator: camera frame or feed, reticle at the centre, telemetry text, boxed targets'
  ew: 'Electronic-warfare operator: spectrum and waterfall displays, emitter marks, threat colours'
  video: 'Video interface: a feed with a crosshair and rounded-rectangle target boxes in states'
palette:
  affiliation:
    friendly: '#80e0ff'
    hostile: '#ff8080'
    neutral: '#aaffaa'
    unknown: '#ffff80'
  frame_shape:
    friendly: rectangle
    hostile: diamond
    neutral: square
    unknown: quatrefoil
  box_states:
    candidate: '#ffc400'
    selected: '#00e5ff'
    confirmed: '#ff3b30'
    cleared: '#34c759'
  threat:
    high: '#ff3b30'
    medium: '#ffb000'
    low: '#3ad0ff'
  console:
    background: '#04121c'
    grid: '#1d4a5e'
    text: '#9fe8ff'
    accent: '#00e5ff'
    warning: '#ffb000'
    alert: '#ff3b30'
    ok: '#34c759'
    panel: '#0a2232'
plot_area:
  spectrum_and_waterfall:
    x0: 70
    y0: 50
    x1: 1250
    y1: 690
    note: pixel box of the data area in the 1280x720 spectrum / waterfall pictures (origin top left)
total_bytes: 3143166
