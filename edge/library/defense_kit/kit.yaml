recipes:
  telemetry_overlay:
    about: 'Generic telemetry text in a UAV camera view: four small monospace text items in the corners, numbers
      from variables or expressions so they can change every trial (no picture). Paste the items into a screen and
      set alt / hdg / spd (e.g. in a variable item: alt: "$random.randint(1800, 2600)").'
    themes: [uav, video]
    components:
    - id: tel_tl
      type: text
      font: DejaVu Sans Mono
      height: 18
      color: '#d8ffd8'
      pos: [-400, 330]
      text: $f'ALT {alt:>5} m   HDG {hdg:03d}   SPD {spd:>3} kt'
    - id: tel_tr
      type: text
      font: DejaVu Sans Mono
      height: 18
      color: '#d8ffd8'
      pos: [470, 330]
      text: $f'SENSOR EO   FOV {fov:.1f}'
    - id: tel_bl
      type: text
      font: DejaVu Sans Mono
      height: 18
      color: '#d8ffd8'
      pos: [-540, -330]
      text: $f'TRACK {track_no:04d}'
    - id: tel_br
      type: text
      font: DejaVu Sans Mono
      height: 18
      color: '#d8ffd8'
      pos: [580, -330]
      text: REC  ●
    variables:
      alt: 2200
      hdg: 45
      spd: 90
      fov: 12.5
      track_no: 417
  message_panel:
    about: 'A message / status panel: panels/message_panel_400x240.png as the background, a header text and up to
      four message lines as text items (change them per trial). Place it in a free corner (here: the right edge
      of a 1280x720 screen). Colours: text #9fe8ff, warning #ffb000, alert #ff3b30.'
    themes: [c2, ew, uav, video]
    components:
    - id: panel
      type: image
      image: stimuli/message_panel_400x240.png
      size: [400, 240]
      pos: [430, 220]
    - id: panel_head
      type: text
      font: DejaVu Sans Mono
      height: 17
      bold: true
      color: '#9fe8ff'
      pos: [430, 323]
      text: MESSAGES
    - id: panel_l1
      type: text
      font: DejaVu Sans Mono
      height: 16
      color: '#9fe8ff'
      pos: [430, 270]
      wrap_width: 370
      text: $msg1
    - id: panel_l2
      type: text
      font: DejaVu Sans Mono
      height: 16
      color: '#ffb000'
      pos: [430, 236]
      wrap_width: 370
      text: $msg2
    variables:
      msg1: 0412  Track 0417 updated
      msg2: '0413  Sector BRAVO: check contact'
