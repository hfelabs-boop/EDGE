name: taskswitching_cued_ops
description: >
  Cued task switching, operational adaptation. The same paradigm, design, timing, keys and measures as the
  library's `taskswitching_cued` task, with a contact instead of a letter-digit pair. Before each contact a cue
  says which attribute to judge: its identity (c2: AFFILIATION, hostile = A, friendly = L; ew: THREAT, high = A,
  low = L) or its kind (c2: DOMAIN, air = A, surface = L; ew: SIGNAL, pulsed = A, continuous = L). The task is
  chosen at random, so it switches unpredictably; the cue-target interval (CTI) is short (200 ms) or long
  (1000 ms). One variable, `theme`, sets the display: c2 (track symbols on a radar plot) or ew (emitter traces on
  a spectrum display).

# HOW THE THEME SWITCH WORKS (the pattern of search_ops, edge/library/tasks/search_ops/search_ops.yaml)
# `theme` is the first variable (c2 or ew). The trial list codes each contact theme-free (identity hostile /
# friendly x kind air / surface) and the task (identity / kind); `looks` maps the contact to the theme's picture
# and `cues` gives the theme's cue words. The display around them (plot or spectrum, instructions) are items
# guarded with `if: "$theme == 'ew'"`.

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2            # display theme: c2 or ew
  prev_task: ""        # the task of the previous trial (empty at the start of a block)
  looks:
    c2: {hostile_air: stimuli/hostile_air_64.png, hostile_surface: stimuli/hostile_surface_64.png,
         friendly_air: stimuli/friendly_air_64.png, friendly_surface: stimuli/friendly_surface_64.png, size: [72, 72]}
    ew: {hostile_air: stimuli/emitter_pulsed_high.png, hostile_surface: stimuli/emitter_continuous_high.png,
         friendly_air: stimuli/emitter_pulsed_low.png, friendly_surface: stimuli/emitter_continuous_low.png, size: [34, 102]}
  # the cue word for each task, per theme; cue colours are the same in every theme
  cues:
    c2: {identity: AFFILIATION, kind: DOMAIN, tag: TRK,
         reminder: "AFFILIATION: hostile = A, friendly = L        DOMAIN: air = A, surface = L"}
    ew: {identity: THREAT, kind: SIGNAL, tag: EMT,
         reminder: "THREAT: high = A, low = L        SIGNAL: pulsed = A, continuous = L"}
  cue_rgb: {identity: "#c39bff", kind: "#ffb347"}   # purple and orange: not affiliation or threat colours

measures:
  - {id: rt, label: Reaction time (correct trials), role: outcome, column: resp.rt,
     trials: "$resp.corr == 1 and cond.transition != 'first'", loop: trials, summary: median, units: s, expect: [0.3, 3.0]}
  - {id: accuracy, label: Accuracy, role: outcome, column: resp.corr, trials: "$cond.transition != 'first'",
     loop: trials, summary: proportion}
  - {id: transition, label: Switch or repeat trial, role: factor, column: cond.transition}
  - {id: cti, label: Cue-target interval (s), role: factor, column: cti}

routines:
  instructions:
    components:
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        text: |
          AFFILIATION OR DOMAIN

          You are watching the radar plot. A track will appear, and just before it a word tells you what to judge:

          AFFILIATION (purple):  hostile (red diamond) = A key     friendly (blue rectangle) = L key
          DOMAIN (orange):     air (wing symbol) = A key     surface (hull symbol) = L key

          The task changes at random, so always look at the word.
          Answer as fast as you can without making mistakes.

          First a practice. Press SPACE to start.
        height: 24
        wrap_width: 1200
      - id: text_ew
        type: text
        if: "$theme == 'ew'"
        text: |
          THREAT OR SIGNAL

          You are watching the spectrum display. An emitter will appear, and just before it a word tells you
          what to judge:

          THREAT (purple): high (red) = A key     low (blue) = L key
          SIGNAL (orange): pulsed (dashed trace) = A key     continuous (solid trace) = L key

          The task changes at random, so always look at the word.
          Answer as fast as you can without making mistakes.

          First a practice. Press SPACE to start.
        height: 24
        wrap_width: 1200
      - {id: go, type: keyboard, keys: [space], end_routine: true}
      - {id: reset, type: variable, set: {prev_task: ""}}

  trial:
    components:
      - id: cond                      # switch or repeat, from the previous trial's task (saved as cond.*)
        type: variable
        set:
          shown_theme: $theme         # the theme in every trial's data (cond.shown_theme)
          transition: "$'first' if prev_task == '' else ('repeat' if task == prev_task else 'switch')"
      # ---- the display around the contact, one block per theme ----
      - {id: plot_c2, type: image, if: "$theme == 'c2'", image: stimuli/plot_radar_1280x720.png, size: [1280, 720]}
      - {id: spectrum_ew, type: image, if: "$theme == 'ew'", image: stimuli/spectrum_1280x720.png, size: [1280, 720]}
      - {id: panel, type: shape, shape: rect, size: [400, 260], fill: "#04121c", opacity: 0.9}
      # ---- the cued task (the same in every theme) ----
      - {id: blank, type: wait, duration: 0.5}
      - {id: frame, type: shape, shape: rect, size: [360, 220], fill: transparent, line_color: "$cue_rgb[task]", line_width: 4, start: 0.5}
      - {id: cue_word, type: text, text: "$cues[theme][task]", color: "$cue_rgb[task]", height: 30, bold: true, pos: [0, 60], start: 0.5,
         marker: cue_on}
      - id: stimulus
        type: image
        image: $looks[theme][contact]
        size: "$looks[theme]['size']"
        pos: [0, -20]
        start: $0.5 + cti
        marker: $f"contact_{task}_{transition}"
      - {id: tag, type: text, font: DejaVu Sans Mono, text: "$f'{cues[theme][\"tag\"]} {track_no:04d}'", color: "#7f9aa6", height: 15, pos: [0, -85], start: $0.5 + cti}
      - id: resp
        type: keyboard
        keys: [a, l]
        start: $0.5 + cti
        duration: 3.0
        correct: $correct_key
        end_routine: true
      - {id: remember, type: variable, when: end, set: {prev_task: $task}}
      - {id: reminder_bar, type: shape, shape: rect, size: [1280, 40], pos: [0, -300], fill: "#0a2232", opacity: 0.85}
      - {id: reminder, type: text, font: DejaVu Sans Mono, text: "$cues[theme]['reminder']", color: "#9fe8ff", height: 17, pos: [0, -300]}

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        text: "$'Correct' if resp.corr == 1 else ('Too slow' if resp.keys is None else 'Wrong')"
        color: "$'#55dd55' if resp.corr == 1 else '#ff5555'"
        height: 36

  practice_done:
    components:
      - id: text
        type: text
        text: |
          Practice finished.

          Now the real test (about 5 minutes). Always look at the word before the contact.
          You will only see a message after a mistake.

          Press SPACE to start.
        height: 26
        wrap_width: 1150
      - {id: go, type: keyboard, keys: [space], end_routine: true}
      - {id: reset, type: variable, set: {prev_task: ""}}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, text: "End of the watch. Thank you!", height: 34}

flow:
  - instructions
  - loop: practice
    conditions: trials.csv
    order: random
    stop_if: "$practice.n >= 15"
    children: [trial, feedback]
  - practice_done
  - loop: trials
    conditions: trials.csv
    order: random
    repeats: 2
    children:
      - trial
      - {routine: feedback, if: "$resp.corr != 1"}
  - thanks
