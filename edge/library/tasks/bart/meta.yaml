id: bart
title: Balloon Analogue Risk Task (BART)
category: Decision making
summary: 'Inflate balloons for money, pump by pump, and collect before they burst: a behavioural measure of risk
  taking.'
description: 'Measures risk taking. 30 balloons; each press of SPACE pumps the current balloon and adds 5 cents
  to a temporary bank, ENTER collects the bank into the total. Each balloon bursts at a point drawn at random between
  1 and 128 pumps (burst chance 1/128 on the first pump, 1/127 on the second, and so on); a burst loses that balloon''s
  money. Main outcome: the adjusted number of pumps, the mean number of pumps on balloons that did not burst; also
  the number of bursts and the total earned.'
measures:
- adjusted pumps (mean pumps on balloons that did not burst)
- mean pumps on all balloons
- number of balloons that burst
- total earned
duration_min: 6
input: keyboard
languages:
- en
references:
- 'Lejuez, C. W., Read, J. P., Kahler, C. W., Richards, J. B., Ramsey, S. E., Stuart, G. L., Strong, D. R., & Brown,
  R. A. (2002). Evaluation of a behavioral measure of risk taking: The Balloon Analogue Risk Task (BART). Journal
  of Experimental Psychology: Applied, 8(2), 75–84.'
see_also:
  psytoolkit: https://www.psytoolkit.org/experiment-library/bart.html
notes: 'No code item: each balloon is a trial of the ''balloons'' list and each pump one screen of the inner list
  ''pumps_loop'', which stops when the balloon bursts or the money is collected. The pumps, the burst point and
  whether it burst are saved per balloon (result.*). Money is shown without a currency sign; change cents_per_pump,
  max_pumps or the 30 repeats to adapt it.'
