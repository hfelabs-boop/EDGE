id: pvtb
title: Brief psychomotor vigilance test (PVT-B)
category: Vigilance
summary: Press a key as fast as possible whenever a millisecond counter starts, for 3 minutes.
description: >-
  A 3-minute reaction-time test of sustained attention, sensitive to sleep loss. At random intervals of 1-4 s a
  red millisecond counter starts in a box; the participant presses SPACE to stop it and sees the reaction time for
  1 s. Presses before the counter or faster than 100 ms are false starts (the trial ends); reactions slower than
  355 ms are lapses (Basner et al., 2011). Three practice trials, then the 3-minute test. Outcomes: mean and median
  RT, mean response speed (1/RT), lapses, false starts and the share of lapses + false starts (performance score
  = 1 - that share).
measures:
- mean RT
- median RT
- mean response speed (1/RT)
- lapses (> 355 ms)
- false starts
- lapses + false starts per trial
duration_min: 4
input: keyboard
languages:
- en
references:
- >-
  Basner, M., Mollicone, D., & Dinges, D. F. (2011). Validity and sensitivity of a brief psychomotor vigilance test
  (PVT-B) to total and partial sleep deprivation. Acta Astronautica, 69, 949–959.
- >-
  Dinges, D. F., & Powell, J. W. (1985). Microcomputer analyses of performance on a portable, simple visual RT task
  during sustained operations. Behavior Research Methods, Instruments, & Computers, 17(6), 652–655.
- >-
  Lim, J., & Dinges, D. F. (2008). Sleep deprivation and vigilant attention. Annals of the New York Academy of Sciences,
  1129, 305–322.
see_also:
  psytoolkit: https://www.psytoolkit.org/experiment-library/pvtb.html
notes: 'Set test_length: 600 and lapse_rt: 0.5 under variables for the classic 10-minute PVT.'
