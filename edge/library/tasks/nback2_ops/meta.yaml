id: nback2_ops
title: 2-back task (operational)
category: Working memory
summary: Press a key whenever the reported track number, emitter type or sector is the same as the one reported two items earlier.
description: >
  The library's 2-back task with operator displays. Items are reported one at a time for 0.5 s, one every 3 s: a
  track number on a tactical plot, an emitter type code on a spectrum display, or the grid sector a surveillance
  camera is looking at. The operator presses SPACE when the item is the same as the one two reports back and
  withholds otherwise. A 22-item practice block with feedback is followed by three blocks of 32 items (2 lead-in
  items plus 30 scored, a third of them matches; non-matches never repeat the item one or two back). Main outcomes
  are the hit rate and the false alarm rate (from which d' can be computed) and the RT on hits, as in the classic
  task.
measures:
- hit rate (response on 2-back matches)
- correct rejections (1 - false alarm rate)
- overall accuracy
- RT on hits
duration_min: 7
input: keyboard
languages: [en]
variant_of: nback2
domain: defense
themes: [c2, ew, uav]
adaptation: >
  The ten letters of the classic task become ten operational items; the sequences, timing, key and measures stay
  the same (the trial lists are nback2's, and the variable `names` maps each letter to its item in each theme).
  c2: the items are four-digit track numbers (TRK 0417 ...) reported next to an unknown-air track symbol on a
  radar-style tactical plot, as when an operator keeps track of which tracks are being reported. ew: the items are
  emitter type codes (TYPE 21 ...) shown under an emitter mark on a spectrum display, as when a receiver classifies
  one emitter after another. uav: the items are grid sectors (SECTOR BRAVO ...) reported in the overlay of a
  surveillance camera picture under a reticle, as when the payload operator follows where the sensor is pointed.
  Numbers, codes, sectors and pictures are generic and fictional.
references:
- "Kirchner, W. K. (1958). Age differences in short-term retention of rapidly changing information. Journal of Experimental Psychology, 55, 352–358."
- "Jaeggi, S. M., Buschkuehl, M., Perrig, W. J., & Meier, B. (2010). The concurrent validity of the N-back task as a working memory measure. Memory, 18, 394–412."
- "Kane, M. J., Conway, A. R. A., Miura, T. K., & Colflesh, G. J. H. (2007). Working memory, attention control, and the n-back task: A question of construct validity. Journal of Experimental Psychology: Learning, Memory, and Cognition, 33(3), 615–622."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/nback2.html"}
notes: >
  Switch the display with the variable `theme` (c2, ew, uav). The trial lists are those of nback2 (column letter);
  each trial records the theme and the item shown (show.shown_theme, show.item). The pictures come from EDGE's
  defence kit (tools/library/make_nback2_ops.py copies them and the trial lists).
