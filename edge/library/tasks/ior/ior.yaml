name: ior
description: >
  Inhibition of return. One of two side boxes flashes (an uninformative cue), then a dot appears in the
  cued or the other box after 100 ms or 800 ms; press SPACE as soon as you see it. On long intervals the
  centre box flashes in between to pull attention back. Detection is faster at the cued place after
  100 ms, but slower there after 800 ms (inhibition of return). One trial in five has no dot (catch trial).

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

measures:
  - {id: rt, label: Detection time, role: outcome, column: resp.rt,
     trials: "$validity != 'catch' and resp.corr == 1", loop: main, summary: mean, units: s, expect: [0.15, 1.0]}
  - {id: accuracy, label: Accuracy (dot detected; on catch trials no press), role: outcome, column: resp.corr, loop: main,
     summary: proportion}
  - {id: validity, label: Cued location (valid / invalid / catch), role: factor, column: validity}
  - {id: ctoa, label: Cue-target interval (s), role: factor, column: ctoa}

routines:
  instructions:
    components:
      - id: text
        type: text
        height: 26
        wrap_width: 1050
        text: |
          Spot the dot

          Keep your eyes on the centre box. The boxes will flash now and then: ignore the flashes,
          they do not tell you where the dot will appear.

          Press SPACE as soon as you see a white dot in the left or right box.
          Sometimes no dot appears: then do not press.

          First 10 practice trials with feedback. Press SPACE to begin.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  main_intro:
    components:
      - id: text
        type: text
        height: 26
        wrap_width: 1050
        text: |
          Practice done. The test has 80 trials (about 4 minutes) without feedback.
          Keep your eyes on the centre.

          Press SPACE to start.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  trial:
    components:
      - {id: box_l, type: shape, shape: rect, size: [100, 100], pos: [-300, 0], fill: transparent, line_color: "#bbbbbb", line_width: 3}
      - {id: box_c, type: shape, shape: rect, size: [100, 100], pos: [0, 0], fill: transparent, line_color: "#bbbbbb", line_width: 3}
      - {id: box_r, type: shape, shape: rect, size: [100, 100], pos: [300, 0], fill: transparent, line_color: "#bbbbbb", line_width: 3}
      - {id: fix, type: text, text: "+", height: 30}
      # peripheral cue: the box on one side flashes for 100 ms (it does not predict the target side)
      - {id: cue, type: shape, shape: rect, size: [112, 112], pos: "$[cue_x, 0]", fill: transparent,
         line_color: white, line_width: 9, start: 1.0, duration: 0.1, marker: "$f'cue_{cue_side}'"}
      # long intervals only: the centre box flashes 300 ms after the cue to draw attention back to fixation
      - {id: recue, type: shape, shape: rect, size: [112, 112], pos: [0, 0], fill: transparent,
         line_color: white, line_width: 9, start: 1.3, duration: 0.1, if: "$ctoa > 0.5"}
      - {id: target, type: shape, shape: circle, radius: 16, fill: white, pos: "$[target_x, 0]", start: $1.0 + ctoa,
         if: "$validity != 'catch'", marker: "$f'target_{validity}'"}
      - {id: resp, type: keyboard, keys: [space], correct: $correct_key, start: $1.0 + ctoa, duration: 1.2,
         end_routine: true}

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        height: 30
        text: >-
          $('Correct' if resp.corr else 'Missed - press when the dot appears') if validity != 'catch'
          else ('Correct - there was no dot' if resp.corr else 'There was no dot this time')
        color: "$'#55dd55' if resp.corr else '#ff5555'"

  iti:
    components:
      - {id: blank, type: wait, duration: 0.6}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, height: 30, text: "Finished. Thank you!"}

flow:
  - instructions
  - loop: practice
    conditions: ior.csv
    order: random
    stop_if: $practice.n >= 9
    children: [trial, feedback]
  - main_intro
  - loop: main
    conditions: ior.csv
    order: random
    repeats: 4
    children: [trial, iti]
  - thanks
