name: mackworth2
description: >
  Mackworth clock test, lamp version with four test periods. Sixty lamps form a ring; one lamp is lit and
  the light moves on by one lamp every second. Now and then it skips a lamp (jumps two places); the
  participant presses SPACE whenever that happens (a press during the jump's second or the next one counts).
  A 40-second practice with feedback, then 8 minutes in four 2-minute periods with 6 jumps each, at
  irregular times. Outcomes per period (the vigilance decrement): hit rate, false alarms, detection time,
  plus a short self-report of alertness before and after.

settings:
  window: {size: [1280, 720], background: "#15151c", units: px}
  participant: {participant: "001", session: "1"}

variables:
  step_time: 1.0          # seconds per pointer step
  pointer: 0              # current position, 0-59
  pending: 0              # 1 while a double jump has not been reported yet
  hits: 0
  misses: 0
  false_alarms: 0

measures:
  - {id: hit_rate, label: Skips detected, role: outcome, column: score.detected, loop: ticks,
     trials: "$after == 1", summary: proportion}
  - {id: false_alarms, label: False alarms (presses without a skip), role: outcome, column: score.fa_now,
     loop: ticks, summary: sum}
  - {id: hit_rt, label: Detection time (from the skip), role: outcome, column: score.hit_rt, loop: ticks,
     trials: "$score.hit_now == 1", summary: median, units: s, expect: [0.15, 2.0]}
  - {id: alert_before, label: Alertness before the test (1-9), role: covariate, column: alert_pre.rating, summary: last}
  - {id: alert_after, label: Alertness after the test (1-9), role: outcome, column: alert_post.rating, summary: last}
  - {id: period, label: Test period (2 min each), role: factor, column: period}

routines:
  instructions:
    components:
      - id: text
        type: text
        height: 27
        wrap_width: 1100
        text: |
          Watch the light

          A ring of lamps will appear. One lamp is lit, and the light moves on to the
          next lamp every second. Once in a while the light SKIPS a lamp (it jumps two places).
          Whenever you see such a skip, press SPACE straight away.
          Do not press for normal single steps.

          Skips are rare, so keep watching the whole time.
          First a 40-second practice with feedback. Press SPACE to start.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  main_intro:
    components:
      - id: text
        type: text
        height: 28
        wrap_width: 1100
        text: |
          Now the test: 8 minutes without feedback and without breaks.
          Press SPACE whenever the light skips a lamp.

          Press SPACE to start.
      - {id: go, type: keyboard, keys: [space], end_routine: true}
      - {id: reset, type: variable, when: end, set: {pointer: 0, pending: 0, hits: 0, misses: 0, false_alarms: 0}}

  alert_pre:
    components:
      - {id: q, type: text, height: 28, pos: [0, 120], wrap_width: 1000,
         text: "Before we start: how alert do you feel right now?\n\nClick on the scale, then press SPACE."}
      - {id: alert_pre, type: slider, ticks: [1, 2, 3, 4, 5, 6, 7, 8, 9], labels: [very sleepy, '', '', '', '', '', '', '', wide awake],
         pos: [0, -60], size: [800, 30], require_confirm: true, end_routine: true}

  alert_post:
    components:
      - {id: q, type: text, height: 28, pos: [0, 120], wrap_width: 1000,
         text: "The test is over. How alert do you feel right now?\n\nClick on the scale, then press SPACE."}
      - {id: alert_post, type: slider, ticks: [1, 2, 3, 4, 5, 6, 7, 8, 9], labels: [very sleepy, '', '', '', '', '', '', '', wide awake],
         pos: [0, -60], size: [800, 30], require_confirm: true, end_routine: true}

  tick:
    duration: $step_time
    components:
      - {id: move, type: variable, set: {pointer: "$(pointer + 1 + double) % 60"}}
      - {id: ring, type: image, image: stimuli/lamps.png, size: [600, 600]}
      # the lit lamp (0 = top, clockwise)
      - {id: lit, type: shape, shape: circle, radius: 13, fill: "#ffe14d", line_color: "#fff6c0", line_width: 3,
         pos: "$[250 * math.sin(math.radians(pointer * 6)), 250 * math.cos(math.radians(pointer * 6))]",
         marker: "$'double_jump' if double else ''"}
      - id: resp
        type: keyboard
        keys: [space]
        duration: $step_time
        correct: "$'space' if double == 1 or (after == 1 and pending == 1) else 'none'"
      - id: score
        type: variable
        when: end
        set:
          resp_now: "$int(resp.keys is not None)"
          hit_now: "$int(resp.keys is not None and (double == 1 or (after == 1 and pending == 1)))"
          fa_now: "$int(resp.keys is not None and not (double == 1 or (after == 1 and pending == 1)))"
          miss_now: "$int(after == 1 and pending == 1 and resp.keys is None)"
          detected: "$(0 if (pending == 1 and resp.keys is None) else 1) if after == 1 else None"
          hit_rt: "$(resp.rt + (step_time if after == 1 and double == 0 else 0)) if resp.keys is not None and (double == 1 or (after == 1 and pending == 1)) else None"
          pending: "$int(double == 1 and resp.keys is None)"
      - id: tally
        type: variable
        when: end
        set:
          hits: "$hits + score.hit_now"
          misses: "$misses + score.miss_now"
          false_alarms: "$false_alarms + score.fa_now"

  practice_feedback:
    duration: 1.0
    components:
      - id: fb
        type: text
        height: 32
        pos: [0, 0]
        text: "$'Well spotted!' if score.hit_now else ('You missed a skip' if score.miss_now else 'That was a single step')"
        color: "$'#5fd38d' if score.hit_now else '#ff8a7a'"
      - {id: ring, type: image, image: stimuli/lamps.png, size: [600, 600]}
      - {id: lit, type: shape, shape: circle, radius: 13, fill: "#ffe14d", line_color: "#fff6c0", line_width: 3,
         pos: "$[250 * math.sin(math.radians(pointer * 6)), 250 * math.cos(math.radians(pointer * 6))]"}

  thanks:
    duration: 4
    components:
      - {id: bye, type: text, height: 32, text: "$f'Thank you, the test is finished. You spotted {hits} of {hits + misses} skips.'"}

flow:
  - alert_pre
  - instructions
  - loop: practice
    conditions: practice.csv
    order: sequential
    children:
      - tick
      - {routine: practice_feedback, if: "$score.hit_now == 1 or score.miss_now == 1 or score.fa_now == 1"}
  - main_intro
  - loop: ticks
    conditions: ticks.csv
    order: sequential
    children: [tick]
  - alert_post
  - thanks
