id: bart_ops
title: Balloon Analogue Risk Task (operational)
category: Decision making
summary: 'Keep a patrol or a surveillance air vehicle on station for more coverage points, pass by pass, and end the sortie
  before the link is lost: a behavioural measure of risk taking.'
description: >-
  The library's BART with operator displays. 30 sorties; each press of SPACE keeps the aircraft on station for one more
  pass (or orbit) and adds 5 coverage points to the sortie, ENTER ends the sortie and banks its points. Each sortie loses
  its link at a point drawn at random between 1 and 128 passes (a chance of 1/128 on the first pass, 1/127 on the second,
  and so on), exactly like the balloon's burst point; a lost link loses that sortie's points. Main outcome: the adjusted
  number of passes, the mean number of passes on sorties that kept their link; also the number of lost links and the points
  banked.
measures:
- adjusted passes (mean passes on sorties that kept their link)
- mean passes on all sorties
- number of sorties that lost their link
- coverage points banked
duration_min: 6
input: keyboard
languages:
- en
variant_of: bart
domain: defense
themes:
- c2
- uav
adaptation: >-
  The balloon becomes a sortie and pumping becomes staying on station: the same burst rule, keys, 30 trials and measures
  as the classic task, with points instead of money. c2: a friendly air patrol (blue rectangle track symbol) on the tactical
  map of Sector BRAVO; its coverage area, a blue ellipse, grows with every pass (the balloon), and a lost link (the burst)
  is shown as a red cross with "LINK LOST". uav: the payload operator's camera picture under a bracket reticle with telemetry
  text; the surveyed area, a cyan box, widens with every orbit, and a lost datalink loses the sortie's recording. The task
  is about weighing more coverage against a rising risk of losing what was gathered; platforms, places and links are generic
  and fictional.
references:
- 'Lejuez, C. W., Read, J. P., Kahler, C. W., Richards, J. B., Ramsey, S. E., Stuart, G. L., Strong, D. R., & Brown, R.
  A. (2002). Evaluation of a behavioral measure of risk taking: The Balloon Analogue Risk Task (BART). Journal of Experimental
  Psychology: Applied, 8(2), 75–84.'
see_also:
  psytoolkit: https://www.psytoolkit.org/experiment-library/bart.html
notes: >-
  Switch the display with the variable `theme` (c2, uav). No code item, as in `bart`: each sortie is a trial of the 'balloons'
  list and each pass one screen of 'pumps_loop'. The result columns keep the classic names so results compare directly:
  result.balloon_pumps = passes, result.exploded = link lost, result.total_cents = coverage points banked (result.shown_theme
  records the theme). Pictures from EDGE's defence kit (tools/library/make_bart_ops.py copies them).
