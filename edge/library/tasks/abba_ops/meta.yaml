id: abba_ops
title: ABBA reversed-compatibility task (operational)
category: Cognitive control
summary: Planning a west or east order slows a quick contact report given with the hand on the same side (action-feature binding).
description: >
  The library's ABBA task with operator displays. On each trial an order with an arrow (1 s) tells the operator
  which response to prepare (A: Q for west/left, P for east/right) without executing it. After a 1 s blank a new
  contact (200 ms) requires an immediate speeded report B (one kind: F with the left hand; the other kind: J with
  the right hand). After B, a question mark prompts the planned response A. When A and B share a side (compatible)
  B is slower and more error-prone than when they do not (incompatible): the reverse of the usual compatibility
  effect. 8 practice trials with feedback, then 48 test trials (each of the four A x B combinations 12 times). The
  main outcome, as in the classic task, is the B reaction time, compatible minus incompatible, on trials where both
  responses were correct.
measures:
  - RT of response B, compatible vs incompatible (positive difference = ABBA effect)
  - accuracy of responses B and A
duration_min: 6
input: keyboard
languages: [en]
variant_of: abba
domain: defense
themes: [c2, ew]
adaptation: >
  The arrow of the classic task becomes an order to be carried out later (shown in an order box with its arrow) and
  the blue or yellow circle becomes a new contact that must be reported at once, as when an operator holds an
  order in mind while the picture changes; the design, timing, keys and measures stay the same. c2: on a
  radar-style plot, the order is to hand a track over to the WEST or EAST controller; the contact is a friendly
  air track (blue rectangle frame, F) or an unknown air track (yellow quatrefoil frame, J). ew: on a waterfall
  display, the order is to steer the antenna WEST or EAST; the contact is a low-threat (blue) or medium-threat
  (amber) pulsed emitter. The blue / yellow-amber colours keep the classic circle colours. Everything is generic
  and fictional.
references:
  - "Stoet, G., & Hommel, B. (1999). Action planning and the temporal binding of response codes. Journal of Experimental Psychology: Human Perception and Performance, 25, 1625-1640."
  - "Stoet, G., & Hommel, B. (2002). Interaction between feature binding in perception and action. In W. Prinz & B. Hommel (Eds.), Common mechanisms in perception and action: Attention and Performance XIX (pp. 538-552). Oxford: Oxford University Press."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/abba.html"}
notes: >
  Switch the display with the variable `theme` (c2, ew). As in the classic task, response A is one key press on
  the same side as the arrow (simplified from the original key sequence). Keys are columns of abba_ops.csv (the
  classic list; the column b_key picks the contact picture). The pictures come from EDGE's defence kit
  (tools/library/make_abba_ops.py copies them).
