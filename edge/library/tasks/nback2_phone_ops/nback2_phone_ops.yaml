name: nback2_phone_ops
description: >
  2-back for a phone held upright, operational adaptation. The same paradigm, letter lists, buttons and measures
  as the library's `nback2_phone` task: items are reported one at a time (0.5 s each, a new one every 3 s) and for
  every item the operator taps MATCH (same as two reports earlier) or NO MATCH. A practice block of 22 items with
  feedback, then 3 blocks of 32 (2 lead-in items + 30 scored, one third matches). Works with a mouse too. One
  variable, `theme`, sets what the items are: c2 (track numbers on a tactical plot), ew (emitter type codes on a
  spectrum display) or uav (the grid sector a camera is looking at). Everything is generic and fictional.

# HOW THE THEME SWITCH WORKS (the pattern of search_ops)
# - The trial lists are the classic task's (column `letter`). `names` maps each letter to what it stands for in
#   each theme, so one stimulus item shows $names[theme][letter] and the 2-back structure is untouched.
# - The display above the buttons (plot, spectrum, camera frame, symbol, reticle) and the instruction texts are
#   items guarded with `if: "$theme == 'uav'"`, one per theme where needed.

settings:
  window: {size: [540, 960], background: "#04121c", units: px}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2               # display theme: c2, ew or uav
  letter_on: 0.5          # seconds each item is shown
  soa: 3.0                # seconds from one item to the next (the response window)
  # what each letter of the trial lists stands for, per theme (ten different names, as the ten letters)
  names:
    c2: {B: TRK 0417, C: TRK 2350, D: TRK 6081, F: TRK 1294, G: TRK 3768, H: TRK 5502, K: TRK 7136,
         L: TRK 4829, M: TRK 8615, N: TRK 0973}
    ew: {B: TYPE 21, C: TYPE 34, D: TYPE 47, F: TYPE 52, G: TYPE 68, H: TYPE 73, K: TYPE 85, L: TYPE 16,
         M: TYPE 39, N: TYPE 90}
    uav: {B: BRAVO, C: CHARLIE, D: DELTA, F: FOXTROT, G: GOLF, H: HOTEL, K: KILO, L: LIMA, M: MIKE, N: NOVEMBER}
  item_name: {c2: track number, ew: emitter type, uav: sector}
  item_caps: {c2: TRACK NUMBER, ew: EMITTER TYPE, uav: SECTOR}
  # where the item's label is drawn and in which colour, per theme
  label_pos: {c2: [0, 140], ew: [0, 140], uav: [0, 20]}
  label_color: {c2: "#ffff80", ew: "#ffb000", uav: "#d8ffd8"}

measures:
  - {id: hit_rate, label: Hits (MATCH on a 2-back match), role: outcome, column: score.ok, loop: trials,
     trials: "$cond == 'target'", summary: proportion}
  - {id: correct_rejections, label: Correct rejections (NO MATCH on non-matches), role: outcome, column: score.ok,
     loop: trials, trials: "$cond == 'nontarget'", summary: proportion}
  - {id: accuracy, label: Accuracy (all scored items), role: outcome, column: score.ok, loop: trials,
     trials: "$cond != 'filler'", summary: proportion}
  - {id: rt, label: RT of correct taps, role: outcome, column: tap.rt, loop: trials,
     trials: "$cond != 'filler' and tap.corr == 1", summary: median, units: s, expect: [0.2, 3.0]}
  - {id: no_answer, label: Items without a tap, role: check, column: score.missed, loop: trials, summary: sum}
  - {id: cond, label: Item type, role: factor, column: cond}

routines:
  instructions:
    components:
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        height: 23
        wrap_width: 480
        pos: [0, 150]
        text: |
          Track monitoring (2-back)

          Track numbers are reported one at a time on the tactical plot.
          For EVERY report, tap one of the two buttons:
          MATCH if it is the same track number as the one reported TWO reports earlier,
          NO MATCH otherwise.

          Example:
          TRK 0417 ... TRK 2350 ... TRK 0417  -> MATCH
          TRK 2350 ... TRK 6081 ... TRK 6081  -> NO MATCH

          First a short practice with feedback.
      - id: text_ew
        type: text
        if: "$theme == 'ew'"
        height: 23
        wrap_width: 480
        pos: [0, 150]
        text: |
          Emitter monitoring (2-back)

          The receiver classifies emitters one at a time.
          For EVERY report, tap one of the two buttons:
          MATCH if it is the same emitter type as the one reported TWO reports earlier,
          NO MATCH otherwise.

          Example:
          TYPE 21 ... TYPE 34 ... TYPE 21  -> MATCH
          TYPE 34 ... TYPE 47 ... TYPE 47  -> NO MATCH

          First a short practice with feedback.
      - id: text_uav
        type: text
        if: "$theme == 'uav'"
        height: 23
        wrap_width: 480
        pos: [0, 150]
        text: |
          Sensor tasking (2-back)

          The camera overlay reports the grid sector in view, one at a time.
          For EVERY report, tap one of the two buttons:
          MATCH if it is the same sector as the one reported TWO reports earlier,
          NO MATCH otherwise.

          Example:
          BRAVO ... CHARLIE ... BRAVO  -> MATCH
          CHARLIE ... DELTA ... DELTA  -> NO MATCH

          First a short practice with feedback.
      - {id: start_btn, type: shape, shape: rect, size: [300, 120], pos: [0, -330], fill: "#1f6b45"}
      - {id: start_lbl, type: text, text: Start, pos: [0, -330], height: 36}
      - {id: go, type: mouse, clickable: [start_btn], end_routine: true}

  main_intro:
    components:
      - id: text
        type: text
        height: 25
        wrap_width: 480
        pos: [0, 150]
        text: "$f'Well done. Now three blocks of about 1.5 minutes each, without feedback.\\nAnswer every report: MATCH (same {item_name[theme]} as two reports before) or NO MATCH.'"
      - {id: start_btn, type: shape, shape: rect, size: [300, 120], pos: [0, -330], fill: "#1f6b45"}
      - {id: start_lbl, type: text, text: Start, pos: [0, -330], height: 36}
      - {id: go, type: mouse, clickable: [start_btn], end_routine: true}

  trial:
    duration: $soa
    components:
      - {id: show, type: variable, set: {shown_theme: $theme, item: "$names[theme][letter]"}}
      # ---- the display above the buttons, one block per theme ----
      - {id: plot_c2, type: image, if: "$theme == 'c2'", image: stimuli/plot_radar_800x800.png, size: [540, 540], pos: [0, 160]}
      - {id: spectrum_ew, type: image, if: "$theme == 'ew'", image: stimuli/spectrum_1280x720.png, size: [960, 540], pos: [0, 160]}
      - {id: camera_uav, type: image, if: "$theme == 'uav'", image: stimuli/terrain_01_farmland.jpg, size: [960, 540], pos: [0, 160]}
      - {id: reticle_uav, type: image, if: "$theme == 'uav'", image: stimuli/reticle_brackets.png, size: [200, 200], pos: [0, 160]}
      - {id: status, type: text, font: DejaVu Sans Mono, height: 16, color: "#9fe8ff", pos: [0, -140], wrap_width: 500,
         text: "$f'SAME {item_caps[theme]} AS TWO REPORTS BEFORE?'"}
      # ---- the item (0.5 s) ----
      - {id: symbol_c2, type: image, if: "$theme == 'c2'", image: stimuli/unknown_air_64.png, size: [64, 64],
         pos: [0, 250], duration: $letter_on}
      - {id: mark_ew, type: image, if: "$theme == 'ew'", image: stimuli/emitter_pulsed_medium.png, size: [28, 84],
         pos: [0, 260], duration: $letter_on}
      - {id: label_box, type: shape, shape: rect, size: [440, 90], pos: "$label_pos[theme]",
         fill: "#04121c", line_color: "#1d4a5e", line_width: 2, opacity: 0.9, duration: $letter_on}
      - {id: stim, type: text, text: "$names[theme][letter]", font: DejaVu Sans Mono, bold: true, height: 56,
         color: "$label_color[theme]",
         pos: "$label_pos[theme]", duration: $letter_on, marker: "$f'item_{cond}'"}
      - {id: b_nomatch, type: shape, shape: rect, size: [240, 200], pos: [-130, -290], fill: "#5a2e2e", line_color: "#c07070", line_width: 3}
      - {id: b_match, type: shape, shape: rect, size: [240, 200], pos: [130, -290], fill: "#2e5a3a", line_color: "#70c090", line_width: 3}
      - {id: l_nomatch, type: text, text: "NO\nMATCH", pos: [-130, -290], height: 34}
      - {id: l_match, type: text, text: MATCH, pos: [130, -290], height: 34}
      - {id: tap, type: mouse, clickable: [b_nomatch, b_match], correct: $corr_button, duration: $soa}
      # a white frame around the button that was tapped, so the operator sees the tap was taken
      - {id: ack, type: shape, shape: rect, size: [258, 218], fill: transparent, line_color: "#ffffff", line_width: 6,
         pos: "$[130, -290] if tap.clicked == 'b_match' else [-130, -290]", start_if: "$tap.clicked is not None"}
      - id: score
        type: variable
        when: end
        set: {ok: "$int(tap.corr == 1)", missed: "$int(tap.clicked is None)"}

  practice_feedback:
    duration: 0.7
    components:
      - id: fb
        type: text
        height: 30
        wrap_width: 480
        pos: [0, 160]
        text: "$('Correct' if tap.corr else ('Too slow' if tap.clicked is None else ('That was a match' if target else 'Not a match')))"
        color: "$'#34c759' if tap.corr else '#ff3b30'"

  rest:
    components:
      - id: text
        type: text
        height: 25
        pos: [0, 150]
        text: "$f'End of block {block[-1]} of 3. Take a short break.'"
      - {id: start_btn, type: shape, shape: rect, size: [300, 120], pos: [0, -330], fill: "#1f6b45"}
      - {id: start_lbl, type: text, text: Continue, pos: [0, -330], height: 36}
      - {id: go, type: mouse, clickable: [start_btn], end_routine: true}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, height: 30, wrap_width: 480, text: "End of the watch. Thank you, the task is finished."}

flow:
  - instructions
  - loop: practice
    conditions: practice.csv
    order: sequential
    children: [trial, practice_feedback]
  - main_intro
  # main.csv holds the three blocks one after the other; a break after the last item of blocks 1 and 2
  - loop: trials
    conditions: main.csv
    order: sequential
    children:
      - trial
      - {routine: rest, if: "$last_in_block == 1 and block != 'block3'"}
  - thanks
