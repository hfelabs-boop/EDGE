id: pvtb_touch_ops
title: Brief psychomotor vigilance test (PVT-B, touch, operational)
category: Vigilance
summary: Tap the screen as fast as possible whenever a new contact, target or emitter alert appears, for 3 minutes.
description: >
  The PVT-B for phones and touchscreens (portrait layout) with operator displays. At random intervals of 1-4 s a
  new alert appears in the upper half of the screen (a new contact on a tactical plot, a new target box in a camera
  picture, or a new emitter on a spectrum display) and a red millisecond counter starts in the alert box below;
  the operator taps anywhere on the screen to acknowledge it and sees the reaction time for 1 s. Taps faster than
  100 ms count as false starts, reactions slower than 355 ms as lapses. Three practice alerts, then 3 minutes.
  Outcomes as in the keyboard version: mean and median RT, response speed, lapses, false starts.
measures:
- mean RT
- median RT
- mean response speed (1/RT)
- lapses (> 355 ms)
- false starts (< 100 ms)
- lapses + false starts per trial
duration_min: 4
input: touch
languages: [en]
variant_of: pvtb_touch
domain: defense
themes: [c2, uav, ew]
adaptation: >
  The PVT's running counter stays (it is the stimulus and the feedback), but it now runs in an alert box and starts
  together with an operational alert; waits, tap, rules and measures stay the same. c2: the alert is a new contact
  (an unknown-air track symbol) popping up on a radar-style tactical plot, labelled NEW CONTACT. uav: the alert is a
  new confirmed target box drawn by the tracker in a camera picture under a reticle, labelled NEW TARGET. ew: the
  alert is a new high-threat pulsed emitter trace on a spectrum display, labelled NEW EMITTER. The task measures
  how quickly and reliably an operator acknowledges alerts on a handheld or touch console. Symbols, signals and
  pictures are generic and fictional.
references:
- "Basner, M., Mollicone, D., & Dinges, D. F. (2011). Validity and sensitivity of a brief psychomotor vigilance test (PVT-B) to total and partial sleep deprivation. Acta Astronautica, 69, 949–959."
- "Dinges, D. F., & Powell, J. W. (1985). Microcomputer analyses of performance on a portable, simple visual RT task during sustained operations. Behavior Research Methods, Instruments, & Computers, 17(6), 652–655."
- "Lim, J., & Dinges, D. F. (2008). Sleep deprivation and vigilant attention. Annals of the New York Academy of Sciences, 1129, 305–322."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/pvtb_touch.html"}
notes: >
  Window 540 x 960 px (portrait). Taps while waiting for the alert are not registered (only anticipations under
  100 ms count as false starts), as in pvtb_touch. Touchscreen latency adds to every RT; compare RTs within one
  device. Switch the display with the variable `theme` (c2, uav, ew). Pictures from EDGE's defence kit
  (tools/library/make_pvtb_ops.py copies them).
