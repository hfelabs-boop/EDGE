id: ab
title: Attentional blink
category: Attention
summary: Two digits hidden in a fast letter stream; the second is often missed shortly after the first.
description: >
  The attentional blink is a short period after attending to one target during which a second target is
  easily missed. Each trial shows a rapid serial visual presentation (RSVP) of 20 black characters in the
  centre of a grey screen, 100 ms each (10 per second), after a 500 ms fixation cross. Two digits (2-9,
  different from each other) replace letters: the first (T1) at position 5-9, the second (T2) 1, 2, 3, 5 or
  7 items later (lag). After the stream the participant types T1 and then T2. 5 practice streams with
  feedback, then 40 test streams (each lag 8 times, random order). The main outcome is T2 accuracy on
  trials with T1 correct, by lag: a dip at lags 2-3 (200-300 ms) with recovery by lag 7, and often
  "lag-1 sparing".
measures:
  - T2 accuracy given T1 correct, by lag
  - T1 accuracy
duration_min: 5
input: keyboard
languages: [en]
references:
  - "Raymond, J. E., Shapiro, K. L., & Arnell, K. M. (1992). Temporary suppression of visual processing in an RSVP task: An attentional blink? Journal of Experimental Psychology: Human Perception and Performance, 18, 849-860."
  - "Duncan, J., Ward, R., & Shapiro, K. (1994). Direct measurement of attentional dwell time in human vision. Nature, 369, 313-315."
  - "Chun, M. M., & Potter, M. C. (1995). A two-stage model for multiple target detection in rapid serial visual presentation. Journal of Experimental Psychology: Human Perception and Performance, 21, 109-127."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/ab.html"}
notes: >
  Dual-target identification version (digits among letters). The item duration is the variable item_time;
  100 ms is 6 frames at 60 Hz, so use a monitor whose refresh rate divides it. Answers are scored in order
  (T1 must be typed first). The stream shown on each trial is saved in place.items; T1 and T2 onsets are
  sent as markers.
