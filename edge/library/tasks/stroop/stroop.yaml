name: stroop
description: >
  Colour-word Stroop task. A colour word (RED, GREEN, BLUE, YELLOW) is shown in coloured ink and the
  participant presses the key for the INK colour, ignoring the word. Half of the trials are congruent
  (word and ink match), half incongruent. Practice with feedback, then 96 test trials.
  Main outcome: the Stroop effect (slower and less accurate on incongruent trials).

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

measures:
  - {id: rt, label: Reaction time (correct trials), role: outcome, column: resp.rt, trials: $resp.corr == 1,
     loop: trials, summary: median, units: s, expect: [0.25, 2.0]}
  - {id: accuracy, label: Accuracy, role: outcome, column: resp.corr, loop: trials, summary: proportion}
  - {id: condition, label: Congruent or incongruent, role: factor, column: condition}

routines:
  instructions:
    components:
      - id: text
        type: text
        text: |
          COLOUR WORDS

          Each word on the screen is printed in a colour.
          Press the key for the colour of the INK, not for what the word says.

          r = red     g = green     b = blue     y = yellow

          Example: the word BLUE printed in red ink -> press r.
          Answer as fast as you can without making mistakes.

          First a short practice. Press SPACE to start.
        height: 26
        wrap_width: 1000
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  trial:
    components:
      - {id: fix, type: fixation, duration: 0.5, size: 30}
      - id: stimulus
        type: text
        text: $word
        color: $ink_rgb
        height: 80
        bold: true
        start: 0.5
        marker: $f"word_{condition}"
      - id: reminder
        type: text
        text: "r = red     g = green     b = blue     y = yellow"
        color: "#888888"
        height: 20
        pos: [0, -300]
      - id: resp
        type: keyboard
        keys: [r, g, b, y]
        start: 0.5
        duration: 2.0
        correct: $correct_key
        end_routine: true

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        text: "$'Correct' if resp.corr == 1 else ('Too slow' if resp.keys is None else 'Wrong key')"
        color: "$'#55dd55' if resp.corr == 1 else '#ff5555'"
        height: 40

  practice_done:
    components:
      - id: text
        type: text
        text: |
          Practice finished.

          Now the real test begins (about 4 minutes). You will only see a message when you make a mistake.

          Press SPACE to start.
        height: 28
        wrap_width: 1000
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  thanks:
    duration: 3
    components:
      - id: bye
        type: text
        text: "Thank you! This task is finished."
        height: 34

flow:
  - instructions
  - loop: practice
    conditions: practice.csv
    order: random
    children: [trial, feedback]
  - practice_done
  - loop: trials
    conditions: stroop.csv
    order: random
    repeats: 4
    max_repeat: {ink: 3}
    children:
      - trial
      - {routine: feedback, if: "$resp.corr != 1"}
  - thanks
