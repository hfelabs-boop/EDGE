name: stroop_en_ops
description: >
  Stroop task, operational adaptation, written to be translated (the operational version of `stroop_en`). EVERY
  text the participant sees is in the `variables` section below (also editable in the builder under Experiment
  settings > Variables): translate those values and nothing else. A track affiliation label (HOSTILE, NEUTRAL,
  FRIENDLY, UNKNOWN, looked up from `affiliation_words`) appears in one of the four affiliation colours and the
  operator presses the key for the label's COLOUR (D F J K, which don't depend on the language). Half congruent,
  half incongruent; practice with feedback, then 96 test trials. One variable, `theme`, sets the display: c2 (a
  track label on a tactical plot) or uav (a target tag under the reticle of a camera frame).

# HOW THE THEME SWITCH WORKS (the pattern of search_ops, edge/library/tasks/search_ops/search_ops.yaml)
# `theme` is the first variable (c2 or uav). Texts that differ between themes are looked up by theme
# (txt_instructions[theme]); the display around the label (plot or camera frame, reticle, telemetry) are items
# guarded with `if: "$theme == 'uav'"`.

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2              # display theme: c2 or uav
# ----------------------------------------------------------------------------------------------
#  TRANSLATE HERE. Change only the text to the right of each colon; keep the names on the left
#  (and the theme names c2 / uav). Keep the key letters D, F, J, K as they are (they are positions on the keyboard).
# ----------------------------------------------------------------------------------------------
  affiliation_words: {hostile: HOSTILE, neutral: NEUTRAL, friendly: FRIENDLY, unknown: UNKNOWN}
  txt_instructions:
    c2: |
      TRACK LABELS

      You are watching the tactical plot. Each new track gets a label that is written in a colour.
      Report the COLOUR of the label, not the word it says.

      Example: the label HOSTILE written in blue -> press J.
      Answer as fast as you can without making mistakes.

      First a short practice. Press SPACE to start.
    uav: |
      TARGET TAGS

      You are the payload operator of a surveillance aircraft. Under the reticle a target tag
      appears, written in a colour. Report the COLOUR of the tag, not the word it says.

      Example: the tag HOSTILE written in blue -> press J.
      Answer as fast as you can without making mistakes.

      First a short practice. Press SPACE to start.
  txt_status: {c2: REPORT THE LABEL COLOUR, uav: REPORT THE TAG COLOUR}
  txt_track: TRK
  txt_keys: "D = red     F = green     J = blue     K = yellow"
  txt_correct: "Correct"
  txt_wrong: "Wrong key: report the colour"
  txt_too_slow: "Too slow"
  txt_practice_done: |
    Practice finished.

    Now the real test begins (about 4 minutes).
    You will only see a message when you make a mistake.

    Press SPACE to start.
  txt_thanks: "End of the watch. Thank you!"
# ----------------------------------------------------------------------------------------------
  cameras: [stimuli/terrain_01_farmland.jpg, stimuli/terrain_05_farmland_ir.jpg]
  # set for every trial by the variable item `show` (these are only starting values, used by the preview)
  camera: stimuli/terrain_01_farmland.jpg
  sensor: EO
  track_no: 417
  alt: 2200
  hdg: 45
  spd: 90

measures:
  - {id: rt, label: Reaction time (correct trials), role: outcome, column: resp.rt, trials: $resp.corr == 1,
     loop: trials, summary: median, units: s, expect: [0.25, 2.0]}
  - {id: accuracy, label: Accuracy, role: outcome, column: resp.corr, loop: trials, summary: proportion}
  - {id: condition, label: Congruent or incongruent, role: factor, column: condition}

routines:
  instructions:
    components:
      - {id: text, type: text, text: "$txt_instructions[theme]", height: 26, wrap_width: 1100, pos: [0, 40]}
      - {id: keys_shown, type: text, text: $txt_keys, height: 26, color: "#cccccc", pos: [0, -250]}
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  trial:
    components:
      - id: show
        type: variable
        set:
          shown_theme: $theme      # puts the theme into every trial's data (column show.shown_theme)
          label: "$affiliation_words[word_id]"
          track_no: "$random.randint(100, 989)"
          camera: "$random.choice(cameras)"
          sensor: "$'IR' if '_ir' in camera else 'EO'"
          alt: "$random.randint(1800, 2600)"
          hdg: "$random.randint(0, 359)"
          spd: "$random.randint(80, 110)"
      # ---- the display around the label, one block per theme ----
      - {id: plot_c2, type: image, if: "$theme == 'c2'", image: stimuli/plot_radar_1280x720.png, size: [1280, 720]}
      - {id: camera_uav, type: image, if: "$theme == 'uav'", image: $camera, size: [1280, 720]}
      - {id: reticle_uav, type: image, if: "$theme == 'uav'", image: stimuli/reticle_brackets.png, size: [240, 240], pos: [0, 150]}
      - {id: tel_uav, type: text, if: "$theme == 'uav'", font: DejaVu Sans Mono, height: 17, color: "#d8ffd8", pos: [-400, 300], text: "$f'ALT {alt} m   HDG {hdg:03d}   SPD {spd} kt'"}
      - {id: tel2_uav, type: text, if: "$theme == 'uav'", font: DejaVu Sans Mono, height: 17, color: "#d8ffd8", pos: [470, 300], text: "$f'SENSOR {sensor}'"}
      - {id: status_bar, type: shape, shape: rect, size: [1280, 40], pos: [0, 340], fill: "#0a2232", opacity: 0.85}
      - {id: status, type: text, font: DejaVu Sans Mono, height: 17, color: "#9fe8ff", pos: [0, 340], text: "$txt_status[theme]"}
      # ---- the Stroop stimulus (the same in every theme) ----
      - {id: fix, type: fixation, duration: 0.5, size: 30}
      - {id: plate, type: shape, shape: rect, size: [560, 150], fill: "#04121c", line_color: "#1d4a5e", line_width: 2, opacity: 0.85, start: 0.5}
      - id: stimulus
        type: text
        text: "$affiliation_words[word_id]"
        color: $ink_rgb
        height: 72
        bold: true
        start: 0.5
        pos: [0, 12]
        marker: $f"word_{condition}"
      - {id: track_tag, type: text, font: DejaVu Sans Mono, text: "$f'{txt_track} {track_no:04d}'", color: "#7f9aa6", height: 18, pos: [0, -48], start: 0.5}
      - {id: reminder_bar, type: shape, shape: rect, size: [1280, 40], pos: [0, -300], fill: "#0a2232", opacity: 0.85}
      - {id: reminder, type: text, text: $txt_keys, color: "#9fe8ff", height: 20, pos: [0, -300]}
      - id: resp
        type: keyboard
        keys: [d, f, j, k]
        start: 0.5
        duration: 2.0
        correct: $correct_key
        end_routine: true

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        text: "$txt_correct if resp.corr == 1 else (txt_too_slow if resp.keys is None else txt_wrong)"
        color: "$'#55dd55' if resp.corr == 1 else '#ff5555'"
        height: 40

  practice_done:
    components:
      - {id: text, type: text, text: $txt_practice_done, height: 28, wrap_width: 1000, pos: [0, 40]}
      - {id: keys_shown, type: text, text: $txt_keys, height: 26, color: "#cccccc", pos: [0, -250]}
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, text: $txt_thanks, height: 34}

flow:
  - instructions
  - loop: practice
    conditions: practice.csv
    order: random
    children: [trial, feedback]
  - practice_done
  - loop: trials
    conditions: stroop.csv
    order: random
    repeats: 4
    max_repeat: {ink: 3}
    children:
      - trial
      - {routine: feedback, if: "$resp.corr != 1"}
  - thanks
