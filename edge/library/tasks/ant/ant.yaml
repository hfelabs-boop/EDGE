name: ant
description: >
  Attention Network Test. A row of five arrows appears above or below the fixation cross; report the
  direction of the middle arrow. Before the arrows, an asterisk cue may appear: none, at the centre,
  at both possible places (double) or at the place where the arrows will appear (spatial). Cue effects
  give the alerting and orienting scores, flanker effects the executive (conflict) score.

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

variables:
  d1: 1.0              # random fixation period before the cue (drawn anew on every trial)

measures:
  - {id: rt, label: Reaction time (correct trials), role: outcome, column: resp.rt, trials: $resp.corr == 1,
     loop: main, summary: mean, units: s, expect: [0.25, 1.7]}
  - {id: accuracy, label: Accuracy, role: outcome, column: resp.corr, loop: main, summary: proportion}
  - {id: cue, label: Cue condition, role: factor, column: cue}
  - {id: flanker, label: Flanker condition, role: factor, column: flanker}

routines:
  instructions:
    components:
      - id: text
        type: text
        height: 25
        wrap_width: 1050
        text: |
          Arrow task

          Keep your eyes on the cross in the middle of the screen.
          A row of arrows will appear above or below the cross.
          Press the arrow key that matches the MIDDLE arrow:

          middle arrow points left  ->  LEFT arrow key
          middle arrow points right ->  RIGHT arrow key

          Sometimes a star (*) appears briefly before the arrows; it tells you when,
          and sometimes where, the arrows will come. Be fast but accurate.

          First 24 practice trials with feedback. Press SPACE to begin.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  main_intro:
    components:
      - id: text
        type: text
        height: 26
        wrap_width: 1050
        text: |
          Practice done. The test has 96 trials (about 6 minutes) without feedback.
          Keep looking at the central cross.

          Press SPACE to start.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  # Timing after Fan et al. (2002): fixation for a random 400-1600 ms (d1), cue 100 ms, fixation 400 ms,
  # arrows until the response (max 1700 ms); the 'rest' screen then pads the trial to 4 s in total.
  trial:
    components:
      - {id: draw_d1, type: variable, set: {d1: "$round(random.uniform(0.4, 1.6), 3)"}}
      - {id: fix, type: text, text: "+", height: 36}
      - {id: cue_c, type: text, text: "*", height: 40, pos: [0, 0], start: $d1, duration: 0.1,
         if: "$cue_center == 1", marker: "$f'cue_{cue}'"}
      - {id: cue_t, type: text, text: "*", height: 40, pos: [0, 100], start: $d1, duration: 0.1,
         if: "$cue_top == 1", marker: "$f'cue_{cue}'"}
      - {id: cue_b, type: text, text: "*", height: 40, pos: [0, -100], start: $d1, duration: 0.1,
         if: "$cue_bottom == 1"}
      - {id: target, type: text, text: $stimulus, height: 44, pos: "$[0, target_y]", start: $d1 + 0.5,
         marker: "$f'target_{flanker}'"}
      - {id: resp, type: keyboard, keys: [left, right], correct: $correct_key, start: $d1 + 0.5, duration: 1.7,
         end_routine: true}

  rest:
    duration: "$max(0.0, 3.5 - d1 - (resp.rt if resp.rt is not None else 1.7))"
    components:
      - {id: fix2, type: text, text: "+", height: 36}

  feedback:
    duration: 1.0
    components:
      - id: fb
        type: text
        height: 30
        text: "$'Correct' if resp.corr else ('Too slow' if resp.keys is None else 'Wrong')"
        color: "$'#55dd55' if resp.corr else '#ff5555'"

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, height: 30, text: "Finished. Thank you!"}

flow:
  - instructions
  - loop: practice
    conditions: ant.csv
    order: random
    stop_if: $practice.n >= 23
    children: [trial, feedback]
  - main_intro
  - loop: main
    conditions: ant.csv
    order: random
    repeats: 2
    children: [trial, rest]
  - thanks
