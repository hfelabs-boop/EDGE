name: numerical_stroop_touch_ops
description: >
  Numerical Stroop (size congruity) task for touchscreens, operational adaptation of `numerical_stroop_touch`. Two
  counts appear in two panels, in different print sizes; the operator taps the panel with the NUMERICALLY larger
  count, ignoring print size. Congruent, incongruent and neutral trials; numerical distance 1 or 5. One variable,
  `theme`, sets the display: c2 (hostile tracks in two sectors of a map) or ew (emitters in two bands of a spectrum
  display).

# HOW THE THEME SWITCH WORKS (the pattern of search_ops, edge/library/tasks/search_ops/search_ops.yaml)
# `theme` is the first variable (c2 or ew). `looks` holds each theme's panel names, digit colour and status line;
# the display around the panels (map or spectrum, instruction texts) are items guarded with `if: "$theme == 'ew'"`.

settings:
  window: {size: [1280, 720], background: "#000000", units: height}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2                # display theme: c2 or ew
  digit_size: 0.25         # print size (fraction of screen height) of a "big" digit
  looks:
    c2: {left: SECTOR ALPHA, right: SECTOR BRAVO, what: HOSTILE TRACKS, colour: "#ff8080",
         status: "TAP THE SECTOR WITH MORE HOSTILE TRACKS"}
    ew: {left: BAND A, right: BAND B, what: EMITTERS DETECTED, colour: "#ffb000",
         status: "TAP THE BAND WITH MORE EMITTERS"}

measures:
  - {id: rt, label: Reaction time (correct taps), role: outcome, column: resp.rt, trials: $resp.corr == 1,
     loop: trials, summary: median, units: s, expect: [0.3, 2.5]}
  - {id: accuracy, label: Accuracy, role: outcome, column: resp.corr, loop: trials, summary: proportion}
  - {id: condition, label: Size congruity, role: factor, column: condition}
  - {id: distance, label: Numerical distance, role: factor, column: distance}

routines:
  instructions:
    components:
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        text: |
          WHICH SECTOR HAS MORE HOSTILE TRACKS?

          You are watching the map of two sectors. Each sector panel shows how many hostile tracks it reports.
          Tap the panel with the larger NUMBER. Ignore how big or small the number is printed.

          Tap as fast as you can without making mistakes.
        height: 0.04
        wrap_width: 1.5
        pos: [0, 0.12]
      - id: text_ew
        type: text
        if: "$theme == 'ew'"
        text: |
          WHICH BAND HAS MORE EMITTERS?

          You are watching the spectrum display. Two panels show how many emitters were detected in band A
          and band B. Tap the panel with the larger NUMBER. Ignore how big or small the number is printed.

          Tap as fast as you can without making mistakes.
        height: 0.04
        wrap_width: 1.5
        pos: [0, 0.12]
      - {id: start_btn, type: shape, shape: rect, size: [0.4, 0.1], fill: "#3a3a3a", line_color: "#aaaaaa", pos: [0, -0.3]}
      - {id: start_label, type: text, text: "Start practice", height: 0.04, pos: [0, -0.3]}
      - {id: go, type: mouse, clickable: [start_btn], touch: true, end_routine: true}

  trial:
    components:
      - {id: show, type: variable, set: {shown_theme: $theme}}    # the theme in every trial's data (show.shown_theme)
      # ---- the display around the panels, one block per theme ----
      - {id: map_c2, type: image, if: "$theme == 'c2'", image: stimuli/map_grid_1280x720.jpg, size: [1.778, 1.0]}
      - {id: spectrum_ew, type: image, if: "$theme == 'ew'", image: stimuli/spectrum_1280x720.png, size: [1.778, 1.0]}
      - {id: status_bar, type: shape, shape: rect, size: [1.778, 0.056], pos: [0, 0.472], fill: "#0a2232", opacity: 0.85}
      - {id: status, type: text, font: DejaVu Sans Mono, height: 0.024, color: "#9fe8ff", pos: [0, 0.472], text: "$looks[theme]['status']"}
      - {id: fix, type: fixation, duration: 0.5, size: 0.05}
      # the two tap targets (count panels), always visible
      - {id: box_left, type: shape, shape: rect, size: [0.4, 0.4], fill: "#04121c", line_color: "#1d4a5e", line_width: 3, opacity: 0.92, pos: [-0.3, 0]}
      - {id: box_right, type: shape, shape: rect, size: [0.4, 0.4], fill: "#04121c", line_color: "#1d4a5e", line_width: 3, opacity: 0.92, pos: [0.3, 0]}
      - {id: name_left, type: text, font: DejaVu Sans Mono, text: "$looks[theme]['left']", color: "#9fe8ff", height: 0.026, pos: [-0.3, 0.24]}
      - {id: name_right, type: text, font: DejaVu Sans Mono, text: "$looks[theme]['right']", color: "#9fe8ff", height: 0.026, pos: [0.3, 0.24]}
      - {id: what_left, type: text, font: DejaVu Sans Mono, text: "$looks[theme]['what']", color: "#5f8090", height: 0.02, pos: [-0.3, -0.17]}
      - {id: what_right, type: text, font: DejaVu Sans Mono, text: "$looks[theme]['what']", color: "#5f8090", height: 0.02, pos: [0.3, -0.17]}
      # ---- the numerical Stroop stimulus (the same in every theme) ----
      - id: left
        type: text
        text: "$f'{left_digit}'"
        color: "$looks[theme]['colour']"
        height: $digit_size * left_size
        pos: [-0.3, 0]
        start: 0.5
        marker: $f"digits_{condition}"
      - id: right
        type: text
        text: "$f'{right_digit}'"
        color: "$looks[theme]['colour']"
        height: $digit_size * right_size
        pos: [0.3, 0]
        start: 0.5
      - id: resp
        type: mouse
        clickable: [box_left, box_right]
        touch: true
        start: 0.5
        duration: 2.5
        correct: $correct_box
        end_routine: true

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        text: "$'Correct' if resp.corr == 1 else ('Too slow' if resp.clicked is None else 'Wrong: tap the larger number')"
        color: "$'#55dd55' if resp.corr == 1 else '#ff5555'"
        height: 0.06

  practice_done:
    components:
      - id: text
        type: text
        text: |
          Practice finished.

          Now the real test (about 4 minutes). You will only see a message after a mistake.
          Tap the panel with the larger number.
        height: 0.04
        wrap_width: 1.5
        pos: [0, 0.12]
      - {id: start_btn, type: shape, shape: rect, size: [0.4, 0.1], fill: "#3a3a3a", line_color: "#aaaaaa", pos: [0, -0.3]}
      - {id: start_label, type: text, text: "Start", height: 0.04, pos: [0, -0.3]}
      - {id: go, type: mouse, clickable: [start_btn], touch: true, end_routine: true}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, text: "End of the watch. Thank you!", height: 0.05}

flow:
  - instructions
  - loop: practice
    conditions: practice.csv
    order: random
    children: [trial, feedback]
  - practice_done
  - loop: trials
    conditions: trials.csv
    order: random
    repeats: 2
    max_repeat: {larger_side: 4}
    children:
      - trial
      - {routine: feedback, if: "$resp.corr != 1"}
  - thanks
