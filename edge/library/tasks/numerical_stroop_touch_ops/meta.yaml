id: numerical_stroop_touch_ops
title: Numerical Stroop task, touchscreen (operational)
category: Inhibition and conflict
summary: Tap the sector or band panel whose count is numerically larger while ignoring the print size.
description: >
  The touchscreen size congruity task (`numerical_stroop_touch`) with operator displays. Two count panels stay on
  the screen; after a 500 ms fixation cross a count appears in each and the operator taps the panel whose count
  has the larger value, within 2.5 seconds. On congruent trials the larger value is printed larger, on
  incongruent trials smaller, on neutral trials both have the same size; pairs differ by 1 or 5 and the larger
  value is equally often left and right (48 combinations, shown twice: 96 test trials) after 8 practice trials
  with feedback. Main outcome: the size congruity effect in tap times and accuracy.
measures:
  - "Median tap RT on correct trials by size congruity (congruent, neutral, incongruent)"
  - "Accuracy by size congruity"
  - "Numerical distance effect (distance 1 vs 5)"
duration_min: 5
input: touch
languages: [en]
variant_of: numerical_stroop_touch
domain: defense
themes: [c2, ew]
adaptation: >
  As in numerical_stroop_ops: the two digits become two counts in tappable panels. c2: hostile tracks reported by
  sector ALPHA (left) and sector BRAVO (right), in the hostile colour over the map grid. ew: emitters detected in
  band A (left) and band B (right), in amber over the spectrum display. Sectors, bands and counts are generic and
  fictional.
references:
  - "Henik, A., & Tzelgov, J. (1982). Is three greater than five: The relation between physical and semantic size in comparison tasks. Memory & Cognition, 10, 389–395."
  - "Besner, D., & Coltheart, M. (1979). Ideographic and alphabetic processing in skilled reading of English. Neuropsychologia, 17, 467–472."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/numerical_stroop_touch.html"}
notes: >
  Switch the display with the variable `theme` (c2, ew). Tap RTs include the movement to the panel. The trial
  lists are the classic task's, copied by tools/library/make_numerical_stroop_ops.py with the kit pictures.
