id: vaast_images_ops
title: Visual approach/avoidance task (VAAST), pictures (operational)
category: Social and implicit
summary: Move towards or away from friendly and hostile track symbols or boxed vehicles in a camera picture; faster approach
  to friendly ones shows an approach-avoidance tendency.
description: >-
  The library's online VAAST with pictures, on operator displays. A scene seen in depth fills the screen and a picture appears
  in the middle (after a 500 ms fixation cross). Y moves the operator forward (the scene and the picture grow), N backward
  (they shrink). In one block FRIENDLY pictures are approached and HOSTILE ones avoided, in the other the reverse; which
  comes first alternates with the participant number. Each block: 4 practice trials, then 32 test trials (16 pictures twice,
  no more than 3 of a category in a row); a wrong key shows a red X. Main outcome: the compatibility effect, correct-trial
  RT in the incompatible block (approach hostile / avoid friendly) minus the compatible block, by picture category and movement;
  accuracy.
measures:
- RT by picture category (friendly / hostile) x movement (approach / avoid)
- accuracy
duration_min: 4
input: keyboard
languages:
- en
variant_of: vaast_images
domain: defense
themes:
- c2
- uav
adaptation: >-
  The corridor and the smiling / frowning faces of the classic task become an operator's display and pictures of friendly
  or hostile objects; blocks, keys, timing, the visual whole-body movement and the measures stay the same. c2: the pictures
  are track symbols with a fictional track number, friendly (blue rectangle frame) or hostile (red diamond frame), with
  air, surface and ground icons; the corridor's frames are drawn in console colours. uav: the pictures are close-ups from
  the payload camera of a vehicle seen from above, marked by the image tracker with a green 'cleared' box (friendly) or
  a red 'confirmed' box (hostile); the whole camera picture closes in (approach) or pulls back (avoid). Symbols, vehicles
  and track numbers are generic and fictional.
references:
- 'Rougier, M., Muller, D., Ric, F., Alexopoulos, T., Batailler, C., Smeding, A., & Aubé, B. (2018). A new look at sensorimotor
  aspects in approach/avoidance tendencies: The role of visual whole-body movement information. Journal of Experimental
  Social Psychology, 76, 42–53.'
- 'Aubé, B., Rougier, M., Muller, D., Ric, F., & Yzerbyt, V. (2019). The online-VAAST: A short and online tool to measure
  spontaneous approach and avoidance tendencies. Acta Psychologica, 201, 102942.'
see_also:
  psytoolkit: https://www.psytoolkit.org/experiment-library/vaast_images.html
notes: >-
  Switch the display with the variable `theme` (c2, uav). The trial lists (images.csv, practice_images.csv) give the category
  (valence) and the place of the picture in its list (item); the pictures are under variables (`looks`, per theme), drawn
  by tools/library/make_vaast_images_ops.py (track symbols and camera vehicles from EDGE's defence kit). The picture shown
  is saved in cond.picture.
