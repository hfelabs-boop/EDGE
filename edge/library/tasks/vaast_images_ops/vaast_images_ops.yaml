name: vaast_images_ops
description: >
  Visual Approach/Avoidance by the Self Task with pictures, operational adaptation (after Rougier et al., 2018, and
  Aubé et al., 2019): the same design, keys and measures as the library's `vaast_images` task, with pictures of
  friendly and hostile objects. A display seen in depth fills the screen; a picture appears in the middle. Pressing
  Y moves you forward into the display (approach: the scene and the picture grow), pressing N moves you backward
  (avoid: they shrink). In one block you approach FRIENDLY pictures and avoid HOSTILE ones, in the other block the
  reverse; which block comes first alternates with the participant number. Each block: 4 practice trials and 32
  test trials (16 pictures twice). A wrong key shows a red X. One variable, `theme`, sets the display: c2 (track
  symbols with track numbers, in the depth of a console plot) or uav (close-ups of vehicles boxed by the image
  tracker, green = cleared, red = confirmed hostile, while the payload camera closes in or pulls back). Main outcome:
  the approach-avoidance compatibility effect, response time when approaching hostile / avoiding friendly pictures
  minus approaching friendly / avoiding hostile ones.

# The theme switch follows search_ops (see that file): `theme` is the first variable. The pictures are data: the
# trial lists give each picture's category (valence) and place in its list (item), and `looks` maps each theme to
# its pictures, so one picture item serves every theme. The scene that moves with the operator (c2: frames in depth;
# uav: the camera picture) is items guarded with `if: "$theme == ..."`. Keys, timing, blocks and measures are those
# of `vaast_images`.

settings:
  window: {size: [1280, 720], background: "#04121c", units: px}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2           # display theme: c2 or uav
  # per theme: the friendly and the hostile pictures (items 0-7 in the test, 8-9 in practice)
  looks:
    c2:
      friendly: [stimuli/track_friendly_1.png, stimuli/track_friendly_2.png, stimuli/track_friendly_3.png, stimuli/track_friendly_4.png, stimuli/track_friendly_5.png, stimuli/track_friendly_6.png, stimuli/track_friendly_7.png, stimuli/track_friendly_8.png, stimuli/track_friendly_9.png, stimuli/track_friendly_10.png]
      hostile: [stimuli/track_hostile_1.png, stimuli/track_hostile_2.png, stimuli/track_hostile_3.png, stimuli/track_hostile_4.png, stimuli/track_hostile_5.png, stimuli/track_hostile_6.png, stimuli/track_hostile_7.png, stimuli/track_hostile_8.png, stimuli/track_hostile_9.png, stimuli/track_hostile_10.png]
    uav:
      friendly: [stimuli/scene_friendly_1.jpg, stimuli/scene_friendly_2.jpg, stimuli/scene_friendly_3.jpg, stimuli/scene_friendly_4.jpg, stimuli/scene_friendly_5.jpg, stimuli/scene_friendly_6.jpg, stimuli/scene_friendly_7.jpg, stimuli/scene_friendly_8.jpg, stimuli/scene_friendly_9.jpg, stimuli/scene_friendly_10.jpg]
      hostile: [stimuli/scene_hostile_1.jpg, stimuli/scene_hostile_2.jpg, stimuli/scene_hostile_3.jpg, stimuli/scene_hostile_4.jpg, stimuli/scene_hostile_5.jpg, stimuli/scene_hostile_6.jpg, stimuli/scene_hostile_7.jpg, stimuli/scene_hostile_8.jpg, stimuli/scene_hostile_9.jpg, stimuli/scene_hostile_10.jpg]
  # each theme's name for the two categories (instructions)
  names:
    c2: {friendly: FRIENDLY tracks, hostile: HOSTILE tracks}
    uav: {friendly: "CLEARED vehicles (green box)", hostile: "HOSTILE vehicles (red box)"}
  order: 1            # 1: approach friendly pictures first, 2: approach hostile ones first (from the participant number)
  approach: friendly  # the category to approach in the current block
  move_dir: 0         # 0 = standing still, 1 = moving forward, -1 = moving backward
  step: 0.62          # the frames shrink by this factor with depth; one step forward grows them by 1/step

measures:
  - {id: rt, label: Response time (correct trials), role: outcome, column: resp.rt,
     trials: "$phase == 'test' and resp.corr == 1", summary: median, units: s, expect: [0.3, 2.0]}
  - {id: accuracy, label: Accuracy, role: outcome, column: resp.corr, trials: "$phase == 'test'", summary: proportion}
  - {id: valence, label: Picture category (friendly / hostile), role: factor, column: valence}
  - {id: movement, label: Movement (approach / avoid), role: factor, column: cond.movement}

routines:
  instructions:
    components:
      - id: counterbalance
        type: variable
        set: {order: "$1 if int(''.join([c for c in str(participant) if c.isdigit()]) or '0') % 2 == 1 else 2"}
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        color: "#e8f8ff"
        height: 24
        wrap_width: 1050
        text: |
          Imagine you are moving through the depth of a console display.
          Track symbols will appear in front of you, one at a time: FRIENDLY tracks (blue rectangle
          frame) and HOSTILE tracks (red diamond frame), each with a track number.

          Press Y to move FORWARD, towards the track.
          Press N to move BACKWARD, away from the track.

          Which tracks to move towards changes between the two parts of the task:
          the instructions before each part tell you. Respond as fast and as accurately as you can.

          Press SPACE to continue.
      - id: text_uav
        type: text
        if: "$theme == 'uav'"
        color: "#e8f8ff"
        height: 24
        wrap_width: 1050
        text: |
          Imagine you are flying a surveillance air vehicle and looking through its camera.
          Close-ups of vehicles will appear in the middle of the picture, one at a time, each marked
          by the image tracker: a green box means CLEARED, a red box means confirmed HOSTILE.

          Press Y to move FORWARD, towards the vehicle (the camera closes in).
          Press N to move BACKWARD, away from the vehicle (the camera pulls back).

          Which vehicles to move towards changes between the two parts of the task:
          the instructions before each part tell you. Respond as fast and as accurately as you can.

          Press SPACE to continue.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  block_intro:
    components:
      - id: rule
        type: variable
        set:
          approach: "$'friendly' if (order == 1) == (block == 1) else 'hostile'"
          avoid: "$'hostile' if approach == 'friendly' else 'friendly'"
      - id: intro
        type: text
        height: 27
        wrap_width: 1100
        color: "#e8f8ff"
        text: "$f\"{'Practice for part ' + str(block) if phase == 'practice' else 'Part ' + str(block) + ': the real trials'}\\n\\nMove FORWARD (Y) towards {names[theme][approach]}.\\nMove BACKWARD (N) away from {names[theme][avoid]}.\\n\\nPress SPACE to start.\""
      - {id: ready, type: keyboard, keys: [space], end_routine: true}

  trial:
    components:
      - id: cond
        type: variable
        set:
          move_dir: 0
          movement: "$'approach' if valence == approach else 'avoid'"
          compatible: "$1 if approach == 'friendly' else 0"
          corr_key: "$'y' if valence == approach else 'n'"
          shown_theme: $theme
          picture: $looks[theme][valence][item]
      # uav: the camera picture, drawn 1/step times the screen so that a step backward still fills the screen; it
      # grows (forward) or shrinks (backward) by one step during the 'move' screen, where move_dir is 1 or -1
      - &cam {id: camera_uav, type: image, if: "$theme == 'uav'", image: stimuli/terrain_03_forest.jpg,
              size: "$[1280 / step * (1 / step) ** (move_dir * min(t / 0.5, 1)), 720 / step * (1 / step) ** (move_dir * min(t / 0.5, 1))]"}
      - &ret {id: reticle_uav, type: image, if: "$theme == 'uav'", image: stimuli/reticle_brackets.png, size: [320, 320], opacity: 0.7}
      # c2: frames in depth, in console colours; they grow (forward) or shrink (backward) by one step during the
      # 'move' screen. One frame nearer than the screen edge comes into view when you step back.
      - &fout {id: frame_near, type: shape, if: "$theme == 'c2'", shape: rect, fill: transparent, line_color: "#2f86a8", line_width: 7,
             size: "$[1240 / step * (1 / step) ** (move_dir * min(t / 0.5, 1)), 700 / step * (1 / step) ** (move_dir * min(t / 0.5, 1))]"}
      - &f0 {id: frame0, type: shape, if: "$theme == 'c2'", shape: rect, fill: transparent, line_color: "#2a7898", line_width: 6,
             size: "$[1240 * (1 / step) ** (move_dir * min(t / 0.5, 1)), 700 * (1 / step) ** (move_dir * min(t / 0.5, 1))]"}
      - &f1 {id: frame1, type: shape, if: "$theme == 'c2'", shape: rect, fill: transparent, line_color: "#256a86", line_width: 5,
             size: "$[1240 * step * (1 / step) ** (move_dir * min(t / 0.5, 1)), 700 * step * (1 / step) ** (move_dir * min(t / 0.5, 1))]"}
      - &f2 {id: frame2, type: shape, if: "$theme == 'c2'", shape: rect, fill: transparent, line_color: "#205c74", line_width: 4,
             size: "$[1240 * step ** 2 * (1 / step) ** (move_dir * min(t / 0.5, 1)), 700 * step ** 2 * (1 / step) ** (move_dir * min(t / 0.5, 1))]"}
      - &f3 {id: frame3, type: shape, if: "$theme == 'c2'", shape: rect, fill: transparent, line_color: "#1b4e62", line_width: 3,
             size: "$[1240 * step ** 3 * (1 / step) ** (move_dir * min(t / 0.5, 1)), 700 * step ** 3 * (1 / step) ** (move_dir * min(t / 0.5, 1))]"}
      - &f4 {id: frame4, type: shape, if: "$theme == 'c2'", shape: rect, fill: transparent, line_color: "#164050", line_width: 2,
             size: "$[1240 * step ** 4 * (1 / step) ** (move_dir * min(t / 0.5, 1)), 700 * step ** 4 * (1 / step) ** (move_dir * min(t / 0.5, 1))]"}
      - &f5 {id: frame5, type: shape, if: "$theme == 'c2'", shape: rect, fill: transparent, line_color: "#12343f", line_width: 2,
             size: "$[1240 * step ** 5 * (1 / step) ** (move_dir * min(t / 0.5, 1)), 700 * step ** 5 * (1 / step) ** (move_dir * min(t / 0.5, 1))]"}
      - &f6 {id: frame6, type: shape, if: "$theme == 'c2'", shape: rect, fill: transparent, line_color: "#0e2a33", line_width: 1,
             size: "$[1240 * step ** 6 * (1 / step) ** (move_dir * min(t / 0.5, 1)), 700 * step ** 6 * (1 / step) ** (move_dir * min(t / 0.5, 1))]"}
      - {id: fix, type: text, text: "+", color: "#e8f8ff", height: 36, duration: 0.5}
      # the picture grows (forward) or shrinks (backward) together with the scene in the 'move' screen
      - &pic {id: stim, type: image, image: $picture, start: 0.5,
              size: "$[200 * (1 / step) ** (move_dir * min(t / 0.5, 1)), 200 * (1 / step) ** (move_dir * min(t / 0.5, 1))]"}
      - {id: resp, type: keyboard, keys: [y, n], correct: $corr_key, start: 0.5, duration: 2.5, end_routine: true}

  move:
    duration: 0.6
    components:
      - id: direction
        type: variable
        save: false
        set: {move_dir: "$1 if resp.keys == 'y' else (-1 if resp.keys == 'n' else 0)"}
      - *cam
      - *ret
      - *fout
      - *f0
      - *f1
      - *f2
      - *f3
      - *f4
      - *f5
      - *f6
      - {<<: *pic, start: 0}
      - {id: error_x, type: text, if: "$not resp.corr", text: "$'X' if resp.keys else 'Too slow'", color: "#ff3b30",
         height: 70, pos: [0, -150]}

  iti:
    duration: 0.4
    components:
      - {id: blank, type: wait}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, height: 30, color: "#9fe8ff", text: "Finished. Thank you!"}

flow:
  - instructions
  - loop: block1_practice
    conditions: [{block: 1, phase: practice}]
    children:
      - block_intro
      - loop: trials1_practice
        conditions: practice_images.csv
        order: random
        repeats: 1
        max_repeat: {valence: 3}
        children: [trial, move, iti]
  - loop: block1_test
    conditions: [{block: 1, phase: test}]
    children:
      - block_intro
      - loop: trials1_test
        conditions: images.csv
        order: random
        repeats: 2
        max_repeat: {valence: 3}
        children: [trial, move, iti]
  - loop: block2_practice
    conditions: [{block: 2, phase: practice}]
    children:
      - block_intro
      - loop: trials2_practice
        conditions: practice_images.csv
        order: random
        repeats: 1
        max_repeat: {valence: 3}
        children: [trial, move, iti]
  - loop: block2_test
    conditions: [{block: 2, phase: test}]
    children:
      - block_intro
      - loop: trials2_test
        conditions: images.csv
        order: random
        repeats: 2
        max_repeat: {valence: 3}
        children: [trial, move, iti]
  - thanks
