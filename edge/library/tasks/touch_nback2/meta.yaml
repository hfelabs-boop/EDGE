id: touch_nback2
title: 2-back task (touchscreen)
category: Working memory
summary: '2-back with letters on a tablet or touch monitor: tap MATCH or NO MATCH for every letter.'
description: >-
  The 2-back task for landscape touchscreens. Letters appear for 0.5 s, one every 3 s, above two large buttons;
  the participant taps MATCH when the letter equals the one two letters back and NO MATCH otherwise; a white frame
  confirms the tap. Practice of 22 letters with feedback, then three blocks of 32 letters (30 scored, one third
  matches). Outcomes: hits, correct rejections, accuracy, RT of correct taps and letters without a tap.
measures:
- hit rate (response on 2-back matches)
- correct rejections (1 - false alarm rate)
- overall accuracy
- RT of correct taps
- letters without a tap
duration_min: 8
input: touch
languages:
- en
variant_of: nback2
references:
- >-
  Kirchner, W. K. (1958). Age differences in short-term retention of rapidly changing information. Journal of Experimental
  Psychology, 55, 352–358.
- >-
  Jaeggi, S. M., Buschkuehl, M., Perrig, W. J., & Meier, B. (2010). The concurrent validity of the N-back task as
  a working memory measure. Memory, 18, 394–412.
- >-
  Kane, M. J., Conway, A. R. A., Miura, T. K., & Colflesh, G. J. H. (2007). Working memory, attention control, and
  the n-back task: A question of construct validity. Journal of Experimental Psychology: Learning, Memory, and Cognition,
  33(3), 615–622.
see_also:
  psytoolkit: https://www.psytoolkit.org/experiment-library/touch_nback2.html
notes: Uses the same letter lists as nback2. Works with a mouse as well.
