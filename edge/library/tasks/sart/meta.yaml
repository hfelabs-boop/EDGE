id: sart
title: Sustained Attention to Response Task (SART)
category: Vigilance
summary: Press a key for every digit except the rare 3, at a fast steady pace.
description: >
  The SART measures lapses of sustained attention. Digits 1 to 9 appear in random order, each for 250 ms
  followed by a 900 ms mask (a ring with a diagonal cross), in five different sizes so that the digit
  must actually be read. The participant presses SPACE for every digit except 3 (the no-go digit,
  about 11% of trials). Because responding becomes automatic, a mind that wanders presses on the 3.
  18 practice trials, then 225 test trials (each digit 25 times, every digit-size pair 5 times).
  Main outcomes are commission errors (presses on 3), omissions on go trials and go reaction time
  (fast, low-variability responding often precedes errors).
measures:
  - "commission errors: accuracy on no-go (3) trials"
  - omissions (hit rate on go trials)
  - go reaction time
duration_min: 5
input: keyboard
languages: [en]
references:
  - "Robertson, I. H., Manly, T., Andrade, J., Baddeley, B. T., & Yiend, J. (1997). 'Oops!': Performance correlates of everyday attentional failures in traumatic brain injured and normal subjects. Neuropsychologia, 35(6), 747-758."
  - "Ralph, B. C. W., Thomson, D. R., Seli, P., Carriere, J. S. A., & Smilek, D. (2015). Media multitasking and behavioral measures of sustained attention. Attention, Perception, & Psychophysics, 77, 390-401."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/sart.html"}
notes: >
  Digit sizes are in pixels (column digit_size); the original used five font sizes between 48 and 120 points.
  Pre-error speeding (RT on the trials before a commission) can be computed from trials.csv.
