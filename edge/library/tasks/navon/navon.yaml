# Generated by tools/library/make_navon.py: edit the generator (or this file, if you don't regenerate it).
name: navon
description: >
  Navon global/local task. A large letter (H or S) is made of small letters (H or S). In the global block
  the participant names the LARGE letter, in the local block the SMALL letters (H key or S key).
  Consistent stimuli have the same letter at both levels, inconsistent ones different letters.
  The block order is counterbalanced by participant number.

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

measures:
  - {id: rt, label: Reaction time (correct trials), role: outcome, column: resp.rt, trials: $resp.corr == 1,
     loop: trials, summary: median, units: s, expect: [0.25, 2.0]}
  - {id: accuracy, label: Accuracy, role: outcome, column: resp.corr, loop: trials, summary: proportion}
  - {id: level, label: Attend to the large (global) or small (local) letter, role: factor, column: level}
  - {id: consistency, label: Same or different letter at both levels, role: factor, column: consistency}

routines:
  instructions:
    components:
      - id: text
        type: text
        text: |
          BIG AND SMALL LETTERS

          You will see a big letter that is made of small letters,
          for example a big H made of small S's.

          The letters are always H or S. Press the H key for H and the S key for S.

          There are two parts. In one you answer the BIG letter, in the other the SMALL letters.
          Before each part you are told which one, and you can practise.

          Keep your eyes on the centre. Press SPACE to continue.
        height: 26
        wrap_width: 1100
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  block_intro:
    components:
      - {id: text, type: text, text: $instruction, height: 28, wrap_width: 1100}
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  trial:
    components:
      - {id: fix, type: fixation, duration: 0.5, size: 30}
      - {id: c00, type: text, text: "$local_letter if cells[0] == 'x' else ''", height: 30, bold: true, pos: [-68, 68], start: 0.5, save: false}
      - {id: c01, type: text, text: "$local_letter if cells[1] == 'x' else ''", height: 30, bold: true, pos: [-34, 68], start: 0.5, save: false}
      - {id: c02, type: text, text: "$local_letter if cells[2] == 'x' else ''", height: 30, bold: true, pos: [0, 68], start: 0.5, save: false}
      - {id: c03, type: text, text: "$local_letter if cells[3] == 'x' else ''", height: 30, bold: true, pos: [34, 68], start: 0.5, save: false}
      - {id: c04, type: text, text: "$local_letter if cells[4] == 'x' else ''", height: 30, bold: true, pos: [68, 68], start: 0.5, save: false}
      - {id: c05, type: text, text: "$local_letter if cells[5] == 'x' else ''", height: 30, bold: true, pos: [-68, 34], start: 0.5, save: false}
      - {id: c06, type: text, text: "$local_letter if cells[6] == 'x' else ''", height: 30, bold: true, pos: [-34, 34], start: 0.5, save: false}
      - {id: c07, type: text, text: "$local_letter if cells[7] == 'x' else ''", height: 30, bold: true, pos: [0, 34], start: 0.5, save: false}
      - {id: c08, type: text, text: "$local_letter if cells[8] == 'x' else ''", height: 30, bold: true, pos: [34, 34], start: 0.5, save: false}
      - {id: c09, type: text, text: "$local_letter if cells[9] == 'x' else ''", height: 30, bold: true, pos: [68, 34], start: 0.5, save: false}
      - {id: c10, type: text, text: "$local_letter if cells[10] == 'x' else ''", height: 30, bold: true, pos: [-68, 0], start: 0.5, save: false}
      - {id: c11, type: text, text: "$local_letter if cells[11] == 'x' else ''", height: 30, bold: true, pos: [-34, 0], start: 0.5, save: false}
      - {id: c12, type: text, text: "$local_letter if cells[12] == 'x' else ''", height: 30, bold: true, pos: [0, 0], start: 0.5, save: false}
      - {id: c13, type: text, text: "$local_letter if cells[13] == 'x' else ''", height: 30, bold: true, pos: [34, 0], start: 0.5, save: false}
      - {id: c14, type: text, text: "$local_letter if cells[14] == 'x' else ''", height: 30, bold: true, pos: [68, 0], start: 0.5, save: false}
      - {id: c15, type: text, text: "$local_letter if cells[15] == 'x' else ''", height: 30, bold: true, pos: [-68, -34], start: 0.5, save: false}
      - {id: c16, type: text, text: "$local_letter if cells[16] == 'x' else ''", height: 30, bold: true, pos: [-34, -34], start: 0.5, save: false}
      - {id: c17, type: text, text: "$local_letter if cells[17] == 'x' else ''", height: 30, bold: true, pos: [0, -34], start: 0.5, save: false}
      - {id: c18, type: text, text: "$local_letter if cells[18] == 'x' else ''", height: 30, bold: true, pos: [34, -34], start: 0.5, save: false}
      - {id: c19, type: text, text: "$local_letter if cells[19] == 'x' else ''", height: 30, bold: true, pos: [68, -34], start: 0.5, save: false}
      - {id: c20, type: text, text: "$local_letter if cells[20] == 'x' else ''", height: 30, bold: true, pos: [-68, -68], start: 0.5, save: false}
      - {id: c21, type: text, text: "$local_letter if cells[21] == 'x' else ''", height: 30, bold: true, pos: [-34, -68], start: 0.5, save: false}
      - {id: c22, type: text, text: "$local_letter if cells[22] == 'x' else ''", height: 30, bold: true, pos: [0, -68], start: 0.5, save: false}
      - {id: c23, type: text, text: "$local_letter if cells[23] == 'x' else ''", height: 30, bold: true, pos: [34, -68], start: 0.5, save: false}
      - {id: c24, type: text, text: "$local_letter if cells[24] == 'x' else ''", height: 30, bold: true, pos: [68, -68], start: 0.5, save: false}
      - id: onset
        type: marker
        label: $f"navon_{level}_{consistency}"
        start: 0.5
      - id: resp
        type: keyboard
        keys: [h, s]
        start: 0.5
        duration: 2.0
        correct: "$global_key if level == 'global' else local_key"
        end_routine: true

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        text: "$'Correct' if resp.corr == 1 else ('Too slow' if resp.keys is None else 'Wrong')"
        color: "$'#55dd55' if resp.corr == 1 else '#ff5555'"
        height: 40

  ready:
    components:
      - id: text
        type: text
        text: "$f'Practice finished. Now the test part: answer the {level_word} letter.  Press SPACE to start.'"
        height: 28
        wrap_width: 1100
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, text: "Thank you! This task is finished.", height: 34}

flow:
  - instructions
  - loop: blocks
    order: counterbalance
    conditions:
      - level: global
        level_word: BIG
        instruction: |
          PART: THE BIG LETTER

          Answer the BIG letter and ignore the small letters it is made of.
          H key = big H        S key = big S

          Press SPACE to practise.
      - level: local
        level_word: SMALL
        instruction: |
          PART: THE SMALL LETTERS

          Answer the SMALL letters and ignore the big letter they form.
          H key = small H's        S key = small S's

          Press SPACE to practise.
    children:
      - block_intro
      - loop: practice
        conditions: stimuli.csv
        order: random
        repeats: 2
        children: [trial, feedback]
      - ready
      - loop: trials
        conditions: stimuli.csv
        order: random
        repeats: 12
        max_repeat: {global_letter: 4, local_letter: 4}
        children:
          - trial
          - {routine: feedback, if: "$resp.corr != 1"}
  - thanks
