name: cueing_ops
description: >
  Posner spatial cueing, operational adaptation. The same paradigm and measures as the library's `cueing` task: two
  places sit left and right of the centre. An arrow in the centre points to one of them; 500 ms later a contact
  appears in one of them and the operator presses the arrow key for its side. The arrow points to the correct side
  on 80% of trials (valid) and to the wrong side on 20% (invalid). One variable, `theme`, sets the display: c2 (two
  sensor sectors on a radar-style plot; a new unknown air contact) or uav (two candidate boxes in a camera frame; a
  vehicle appears in one). All pictures are synthetic and generic (EDGE's defence kit).

# Theme switch as in search_ops: `theme` is the first variable; `looks` maps each theme to its target picture, and
# the display around the stimuli (plot and sector frames, camera frame, candidate boxes, reticle, instruction texts)
# is guarded with `if: $theme == ...`. The trial list, timing, keys, correct answers and measures are the same for
# every theme (and as in cueing).

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2              # display theme: c2 or uav
  looks:
    c2: {target: stimuli/unknown_air_48.png, size: [48, 48]}
    uav: {target: stimuli/vehicle_tracked_light.png, size: [56, 56]}
  target_name: {c2: contact, uav: vehicle}
  soa: 0.5             # time from the arrow cue to the target (s)

measures:
  - {id: rt, label: Reaction time (correct trials), role: outcome, column: resp.rt, trials: $resp.corr == 1,
     loop: main, summary: mean, units: s, expect: [0.15, 1.5]}
  - {id: accuracy, label: Accuracy, role: outcome, column: resp.corr, loop: main, summary: proportion}
  - {id: validity, label: Cue validity, role: factor, column: validity}

routines:
  instructions:
    components:
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        height: 25
        wrap_width: 1100
        pos: [0, 60]
        text: |
          You are watching two sensor sectors, WEST and EAST, on the air-picture plot.

          Keep your eyes on the centre of the plot. A new contact (yellow, unknown) will appear
          in the left or the right sector. Press the LEFT or RIGHT arrow key for its side, as fast as you can.

          Just before the contact, a cyan arrow in the centre points to one sector (a cue from the
          sensor chain). The arrow is usually right, but not always.

          First 10 practice trials with feedback. Press SPACE to begin.
      - id: text_uav
        type: text
        if: "$theme == 'uav'"
        height: 25
        wrap_width: 1100
        pos: [0, 60]
        text: |
          You are the payload operator of a surveillance aircraft. The tracker has put two candidate boxes
          on the camera picture, left and right.

          Keep your eyes on the reticle in the centre. A vehicle will appear in the left or the right box.
          Press the LEFT or RIGHT arrow key for its side, as fast as you can.

          Just before the vehicle, a cyan arrow in the centre points to one box (a cue from the tracker).
          The arrow is usually right, but not always.

          First 10 practice trials with feedback. Press SPACE to begin.
      - {id: example_bg, type: shape, shape: rect, size: [140, 140], pos: [0, -260], fill: "#26323a", line_color: "#5a7a8a", line_width: 1}
      - {id: example, type: image, image: "$looks[theme]['target']", size: "$looks[theme]['size']", pos: [0, -260]}
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  main_intro:
    components:
      - id: text
        type: text
        height: 26
        wrap_width: 1050
        text: |
          Practice done. The test has 80 trials (about 4 minutes) without feedback.

          Press SPACE to start.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  trial:
    components:
      - {id: look, type: variable, set: {shown_theme: $theme}}   # puts the theme into every trial's data
      # ---- the display: the two places, one block per theme ----
      - {id: plot_c2, type: image, if: "$theme == 'c2'", image: stimuli/plot_radar_1280x720.png, size: [1280, 720]}
      - {id: box_l_c2, type: shape, if: "$theme == 'c2'", shape: rect, size: [130, 130], pos: [-300, 0], fill: transparent, line_color: "#5aa0c0", line_width: 3}
      - {id: box_r_c2, type: shape, if: "$theme == 'c2'", shape: rect, size: [130, 130], pos: [300, 0], fill: transparent, line_color: "#5aa0c0", line_width: 3}
      - {id: name_l_c2, type: text, if: "$theme == 'c2'", text: SECTOR WEST, font: DejaVu Sans Mono, height: 15, color: "#9fe8ff", pos: [-300, -85]}
      - {id: name_r_c2, type: text, if: "$theme == 'c2'", text: SECTOR EAST, font: DejaVu Sans Mono, height: 15, color: "#9fe8ff", pos: [300, -85]}
      - {id: camera_uav, type: image, if: "$theme == 'uav'", image: stimuli/terrain_03_forest.jpg, size: [1280, 720]}
      - {id: reticle_uav, type: image, if: "$theme == 'uav'", image: stimuli/reticle_cross.png, size: [240, 240], opacity: 0.5}
      - {id: box_l_uav, type: image, if: "$theme == 'uav'", image: stimuli/box_candidate_128.png, size: [128, 128], pos: [-300, 0]}
      - {id: box_r_uav, type: image, if: "$theme == 'uav'", image: stimuli/box_candidate_128.png, size: [128, 128], pos: [300, 0]}
      # ---- fixation, cue, target (the same for every theme) ----
      - {id: fix, type: text, text: "+", height: 36, color: "#9fe8ff", duration: 1.0}
      - {id: cue_arrow, type: text, text: $cue, height: 60, color: "#00e5ff", start: 1.0, marker: "$f'cue_{cue_side}'"}
      - {id: target, type: image, image: "$looks[theme]['target']", size: "$looks[theme]['size']", pos: "$[target_x, 0]",
         start: $1.0 + soa, marker: "$f'target_{validity}'"}
      - {id: resp, type: keyboard, keys: [left, right], correct: $correct_key, start: $1.0 + soa, duration: 1.5,
         end_routine: true}

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        height: 30
        text: "$'Correct' if resp.corr else ('Too slow' if resp.keys is None else 'Wrong side')"
        color: "$'#34c759' if resp.corr else '#ff3b30'"

  iti:
    components:
      - {id: blank, type: wait, duration: 0.5}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, height: 30, text: "End of the watch. Thank you!"}

flow:
  - instructions
  - loop: practice
    conditions: cueing_ops.csv
    order: random
    children: [trial, feedback]
  - main_intro
  - loop: main
    conditions: cueing_ops.csv
    order: random
    repeats: 8
    children: [trial, iti]
  - thanks
