id: flanker
title: Flanker task (letters)
category: Inhibition and conflict
summary: Classify the middle letter of a five-letter row while ignoring the letters around it.
description: >
  The Eriksen flanker task measures how well a person can focus on one item and filter out nearby
  distractors. Each trial shows a row of five letters; the participant classifies the middle letter
  (H or K with one key, S or C with the other). The outer letters are identical to the target, a different
  letter mapped to the same key (same_response), a letter mapped to the other key (incongruent), or a
  neutral X. A fixation cross (500 ms) precedes the letters, which stay until the answer (max 2 s).
  After 12 practice trials with feedback come 80 test trials (16 combinations x 5, random order).
  The main outcome is the flanker effect: slower and less accurate answers on incongruent than on
  identical or neutral trials; same_response vs identical separates perceptual from response conflict.
measures:
  - RT by flanker condition (flanker effect = incongruent minus identical/neutral)
  - accuracy by flanker condition
duration_min: 4
input: keyboard
languages: [en]
references:
  - "Eriksen, B. A., & Eriksen, C. W. (1974). Effects of noise letters upon the identification of a target letter in a nonsearch task. Perception & Psychophysics, 16, 143-149."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/flanker.html"}
notes: Keys Z and M; change correct_key in flanker.csv to remap. Number of test trials = repeats of the main trial list (16 rows each).
