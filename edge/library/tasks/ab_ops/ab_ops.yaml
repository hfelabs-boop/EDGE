name: ab_ops
description: >
  Attentional blink, operational adaptation. The same paradigm and measures as the library's `ab` task: a rapid
  stream of codes is shown in a readout window in the centre of the screen, one every 100 ms. Most codes are
  letters; two are numbers. After the stream, the operator types the first number and then the second. The second
  number is often missed when it comes 200-500 ms after the first (the "blink"), but less so right after it
  (lag 1, "lag-1 sparing") or later. One variable, `theme`, sets the display: c2 (the identity readout of passing
  tracks, over a radar-style plot) or ew (the code readout of intercepted emitters, over a waterfall). All
  pictures are synthetic and generic (EDGE's defence kit).

# Theme switch as in search_ops: `theme` is the first variable; `looks` maps each theme to the readout's title and
# ink colour, and the display around the stream (plot, waterfall, instruction texts) is guarded with
# `if: $theme == ...`. The trial list, stream, timing, keys, correct answers and measures are the same for every
# theme (and as in ab).

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2              # display theme: c2 or ew
  looks:
    c2: {title: TRACK ID, ink: "#ffd27f"}
    ew: {title: EMITTER CODE, ink: "#9fe8ff"}
  item_time: 0.1       # time per item in the stream (s); 0.1 = 10 items per second
  digits: ["2", "3", "4", "5", "6", "7", "8", "9"]
  # letters used as distractor codes (I, O, S, Z, B, G, Q and D are left out: they look like digits)
  letter_pool: [A, C, E, F, H, J, K, L, M, N, P, R, T, U, V, W, X, Y]
  t1_pos: 6
  t1_digit: "2"
  t2_digit: "3"
  items: [A, C, E, F, H, J, K, L, M, N, P, R, T, U, V, W, X, Y, A, C]

measures:
  - {id: t2_given_t1, label: Second number correct (when the first was correct), role: outcome, column: resp_t2.corr,
     trials: $resp_t1.corr == 1, loop: main, summary: proportion}
  - {id: t1_accuracy, label: First number correct, role: outcome, column: resp_t1.corr, loop: main, summary: proportion}
  - {id: lag, label: Lag (items from first to second number), role: factor, column: lag}

routines:
  instructions:
    components:
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        height: 25
        wrap_width: 1100
        text: |
          You are watching the TRACK ID readout while a stream of tracks passes through your sector.

          Identity codes will flash very quickly in the readout window. Most are letters, but in each stream
          TWO codes are NUMBERS (from 2 to 9): those are the tracks you must report.

          After the stream, type the FIRST number you saw, then the SECOND number.
          If you are not sure, make your best guess.

          First 5 practice streams with feedback. Press SPACE to begin.
      - id: text_ew
        type: text
        if: "$theme == 'ew'"
        height: 25
        wrap_width: 1100
        text: |
          You are watching the EMITTER CODE readout of a signal receiver during a busy intercept period.

          Emitter codes will flash very quickly in the readout window. Most are letters, but in each stream
          TWO codes are NUMBERS (from 2 to 9): those are the emitters you must report.

          After the stream, type the FIRST number you saw, then the SECOND number.
          If you are not sure, make your best guess.

          First 5 practice streams with feedback. Press SPACE to begin.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  main_intro:
    components:
      - id: text
        type: text
        height: 26
        wrap_width: 1050
        text: |
          Practice done. The test has 40 streams (about 4 minutes) without feedback.

          Press SPACE to start.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  stream:
    duration: $0.5 + 20 * item_time
    components:
      # build this trial's stream: 20 different letters with the two numbers put in at t1_pos and t1_pos + lag
      - id: pick
        type: variable
        set: {t1_pos: "$random.randint(4, 8)", t1_digit: "$random.choice(digits)", shown_theme: $theme}
      - id: build
        type: variable
        set:
          t2_digit: "$random.choice([d for d in digits if d != t1_digit])"
          letters: "$random.sample(letter_pool, 18) + random.sample(letter_pool, 2)"
      - id: place
        type: variable
        set:
          items: "$[t1_digit if i == t1_pos else (t2_digit if i == t1_pos + lag else letters[i]) for i in range(20)]"
      # ---- the display around the readout, one block per theme ----
      - {id: plot_c2, type: image, if: "$theme == 'c2'", image: stimuli/plot_radar_1280x720.png, size: [1280, 720]}
      - {id: waterfall_ew, type: image, if: "$theme == 'ew'", image: stimuli/waterfall_1280x720.jpg, size: [1280, 720]}
      # ---- the readout window and the stream (the same for every theme) ----
      - {id: window, type: shape, shape: rect, size: [200, 150], pos: [0, -10], fill: "#0a2232", line_color: "#5aa0c0", line_width: 2}
      - {id: window_title, type: text, text: "$looks[theme]['title']", font: DejaVu Sans Mono, height: 15, color: "#9fe8ff", pos: [0, 50]}
      - {id: fix, type: text, text: "+", height: 40, color: "$looks[theme]['ink']", pos: [0, -10], duration: 0.5}
      - {id: t1_mark, type: marker, label: T1, start: "$0.5 + t1_pos * item_time"}
      - {id: t2_mark, type: marker, label: T2, start: "$0.5 + (t1_pos + lag) * item_time"}
      # the stream: 20 codes, item_time each, at the centre of the readout window
      - {id: s0, type: text, pos: [0, -10], text: "$items[0]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 0 * item_time", duration: $item_time}
      - {id: s1, type: text, pos: [0, -10], text: "$items[1]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 1 * item_time", duration: $item_time}
      - {id: s2, type: text, pos: [0, -10], text: "$items[2]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 2 * item_time", duration: $item_time}
      - {id: s3, type: text, pos: [0, -10], text: "$items[3]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 3 * item_time", duration: $item_time}
      - {id: s4, type: text, pos: [0, -10], text: "$items[4]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 4 * item_time", duration: $item_time}
      - {id: s5, type: text, pos: [0, -10], text: "$items[5]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 5 * item_time", duration: $item_time}
      - {id: s6, type: text, pos: [0, -10], text: "$items[6]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 6 * item_time", duration: $item_time}
      - {id: s7, type: text, pos: [0, -10], text: "$items[7]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 7 * item_time", duration: $item_time}
      - {id: s8, type: text, pos: [0, -10], text: "$items[8]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 8 * item_time", duration: $item_time}
      - {id: s9, type: text, pos: [0, -10], text: "$items[9]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 9 * item_time", duration: $item_time}
      - {id: s10, type: text, pos: [0, -10], text: "$items[10]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 10 * item_time", duration: $item_time}
      - {id: s11, type: text, pos: [0, -10], text: "$items[11]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 11 * item_time", duration: $item_time}
      - {id: s12, type: text, pos: [0, -10], text: "$items[12]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 12 * item_time", duration: $item_time}
      - {id: s13, type: text, pos: [0, -10], text: "$items[13]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 13 * item_time", duration: $item_time}
      - {id: s14, type: text, pos: [0, -10], text: "$items[14]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 14 * item_time", duration: $item_time}
      - {id: s15, type: text, pos: [0, -10], text: "$items[15]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 15 * item_time", duration: $item_time}
      - {id: s16, type: text, pos: [0, -10], text: "$items[16]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 16 * item_time", duration: $item_time}
      - {id: s17, type: text, pos: [0, -10], text: "$items[17]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 17 * item_time", duration: $item_time}
      - {id: s18, type: text, pos: [0, -10], text: "$items[18]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 18 * item_time", duration: $item_time}
      - {id: s19, type: text, pos: [0, -10], text: "$items[19]", font: DejaVu Sans Mono, bold: true, height: 64, color: "$looks[theme]['ink']", start: "$0.5 + 19 * item_time", duration: $item_time}

  ask_t1:
    components:
      - {id: q1, type: text, height: 30, text: "Which was the FIRST number? (type 2-9)"}
      - {id: resp_t1, type: keyboard, keys: ["2", "3", "4", "5", "6", "7", "8", "9"], correct: $t1_digit,
         end_routine: true}

  ask_t2:
    components:
      - {id: q2, type: text, height: 30, text: "Which was the SECOND number? (type 2-9)"}
      - {id: resp_t2, type: keyboard, keys: ["2", "3", "4", "5", "6", "7", "8", "9"], correct: $t2_digit,
         end_routine: true}

  feedback:
    duration: 1.5
    components:
      - id: fb
        type: text
        height: 28
        text: "$f'The numbers were {t1_digit} and {t2_digit}. ' + ('Both right!' if resp_t1.corr and resp_t2.corr else '')"
        color: "$'#34c759' if resp_t1.corr and resp_t2.corr else 'white'"

  iti:
    components:
      - {id: blank, type: wait, duration: 0.5}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, height: 30, text: "End of the watch. Thank you!"}

flow:
  - instructions
  - loop: practice
    conditions: ab_ops.csv
    order: random
    children: [stream, ask_t1, ask_t2, feedback]
  - main_intro
  - loop: main
    conditions: ab_ops.csv
    order: random
    repeats: 8
    children: [stream, ask_t1, ask_t2, iti]
  - thanks
