name: deary_liewald_ops
description: >
  Deary-Liewald reaction time task, operational adaptation (after Deary, Liewald & Nissan, 2011): the same design,
  keys and measures as the library's `deary_liewald` task, as an alert response. Simple reaction time: an alert
  appears in a single box after a random wait of 1-3 s; press SPACE as fast as possible (8 practice, 20 test
  trials). Choice reaction time: four boxes in a row; the alert appears in one of them and the key under that box
  must be pressed (Z, X, N, M from left to right; 8 practice, 40 test trials, each box 10 times in random order).
  One variable, `theme`, sets the display: c2 (sector panels on the tactical plot; the alert is a hostile air track)
  or video (candidate boxes on a camera feed; the alert is a confirmed target box). Main outcomes: mean and SD of
  simple RT, mean and SD of choice RT on correct trials, choice accuracy.

# The theme switch follows search_ops (see that file): `theme` is the first variable; the boxes, the alert and the
# display around them are items guarded with `if: "$theme == ..."`, one per theme where needed. Trial lists, keys,
# timing and measures are those of `deary_liewald`.

settings:
  window: {size: [1280, 720], background: "#04121c", units: px}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2                     # display theme: c2 or video
  delay: 2.0                    # wait before the alert (s), drawn anew on every trial
  sectors: [ALPHA, BRAVO, CHARLIE, DELTA]

measures:
  - {id: rt, label: Reaction time (correct trials), role: outcome, column: resp.rt, trials: "$phase == 'test' and resp.corr == 1",
     summary: mean, units: s, expect: [0.15, 1.5]}
  - {id: rt_sd, label: SD of reaction time (correct trials), role: outcome, column: resp.rt,
     trials: "$phase == 'test' and resp.corr == 1", summary: sd, units: s}
  - {id: accuracy, label: Accuracy, role: outcome, column: resp.corr, trials: "$phase == 'test'", summary: proportion}
  - {id: task, label: Simple or choice reaction time, role: factor, column: task}

routines:
  simple_intro:
    components:
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        height: 25
        wrap_width: 1050
        color: "#e8f8ff"
        text: |
          Part 1: simple reaction time

          You are watching a sector panel on the tactical plot. Rest a finger on the SPACE bar.
          Every now and then an alert appears in the panel: a HOSTILE AIR track (red diamond).
          Press SPACE as fast as you can when it appears.

          First 8 practice trials. Press SPACE to start.
      - id: text_video
        type: text
        if: "$theme == 'video'"
        height: 25
        wrap_width: 1050
        color: "#e8f8ff"
        text: |
          Part 1: simple reaction time

          You are watching a camera feed. An image tracker marks a candidate object with an amber box.
          Rest a finger on the SPACE bar. Every now and then the tracker confirms the target:
          the box turns RED. Press SPACE as fast as you can when it does.

          First 8 practice trials. Press SPACE to start.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  choice_intro:
    components:
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        height: 25
        wrap_width: 1100
        color: "#e8f8ff"
        text: |
          Part 2: choice reaction time

          Now there are four sector panels in a row: ALPHA, BRAVO, CHARLIE, DELTA.
          Put your fingers on Z, X, N and M (left middle finger on Z, left index on X,
          right index on N, right middle finger on M).

          When an alert appears in a sector, press the key that belongs to that sector, as fast as you can:
          Z = ALPHA   X = BRAVO   N = CHARLIE   M = DELTA

          First 8 practice trials. Press SPACE to start.
      - id: text_video
        type: text
        if: "$theme == 'video'"
        height: 25
        wrap_width: 1100
        color: "#e8f8ff"
        text: |
          Part 2: choice reaction time

          Now the tracker marks four candidates in a row. Put your fingers on Z, X, N and M
          (left middle finger on Z, left index on X, right index on N, right middle finger on M).

          When one of the boxes turns RED, press the key that belongs to that box, as fast as you can:
          Z = first box   X = second   N = third   M = fourth

          First 8 practice trials. Press SPACE to start.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  trial:
    components:
      - id: wait_time
        type: variable
        set: {delay: "$round(random.uniform(1.0, 3.0), 3)", shown_theme: $theme}
      # c2: the tactical plot, sector panels (one in the middle, or four in a row) with their names; the alert is a
      # hostile air track symbol
      - {id: plot_c2, type: image, if: "$theme == 'c2'", image: stimuli/plot_radar_1280x720.png, size: [1280, 720], opacity: 0.6}
      - {id: box_c, type: shape, if: "$theme == 'c2' and task == 'simple'", shape: rect, size: [150, 150], pos: [0, 0], fill: "#0a2232", line_color: "#00e5ff", line_width: 3}
      - {id: box_1, type: shape, if: "$theme == 'c2' and task == 'choice'", shape: rect, size: [150, 150], pos: [-330, 0], fill: "#0a2232", line_color: "#00e5ff", line_width: 3}
      - {id: box_2, type: shape, if: "$theme == 'c2' and task == 'choice'", shape: rect, size: [150, 150], pos: [-110, 0], fill: "#0a2232", line_color: "#00e5ff", line_width: 3}
      - {id: box_3, type: shape, if: "$theme == 'c2' and task == 'choice'", shape: rect, size: [150, 150], pos: [110, 0], fill: "#0a2232", line_color: "#00e5ff", line_width: 3}
      - {id: box_4, type: shape, if: "$theme == 'c2' and task == 'choice'", shape: rect, size: [150, 150], pos: [330, 0], fill: "#0a2232", line_color: "#00e5ff", line_width: 3}
      - {id: name_1, type: text, if: "$theme == 'c2' and task == 'choice'", font: DejaVu Sans Mono, height: 18, color: "#9fe8ff", pos: [-330, 100], text: "$sectors[0]"}
      - {id: name_2, type: text, if: "$theme == 'c2' and task == 'choice'", font: DejaVu Sans Mono, height: 18, color: "#9fe8ff", pos: [-110, 100], text: "$sectors[1]"}
      - {id: name_3, type: text, if: "$theme == 'c2' and task == 'choice'", font: DejaVu Sans Mono, height: 18, color: "#9fe8ff", pos: [110, 100], text: "$sectors[2]"}
      - {id: name_4, type: text, if: "$theme == 'c2' and task == 'choice'", font: DejaVu Sans Mono, height: 18, color: "#9fe8ff", pos: [330, 100], text: "$sectors[3]"}
      - {id: name_c, type: text, if: "$theme == 'c2' and task == 'simple'", font: DejaVu Sans Mono, height: 18, color: "#9fe8ff", pos: [0, 100], text: SECTOR BRAVO}
      - {id: alert_c2, type: image, if: "$theme == 'c2'", image: stimuli/hostile_air_64.png, size: [96, 96], pos: "$[xpos, 0]", start: $delay}
      # video: the camera feed with a crosshair, candidate boxes; the alert is the confirmed (red) box
      - {id: feed_video, type: movie, if: "$theme == 'video'", movie: stimuli/feed_04_vehicles.mp4, size: [1280, 720], loop: true,
         volume: 0, duration: "$delay + 2.0"}
      - {id: cross_video, type: image, if: "$theme == 'video'", image: stimuli/crosshair_full_1280x720.png, size: [1280, 720]}
      - {id: cand_c, type: image, if: "$theme == 'video' and task == 'simple'", image: stimuli/box_candidate_128.png, size: [150, 150], pos: [0, 0]}
      - {id: cand_1, type: image, if: "$theme == 'video' and task == 'choice'", image: stimuli/box_candidate_128.png, size: [150, 150], pos: [-330, 0]}
      - {id: cand_2, type: image, if: "$theme == 'video' and task == 'choice'", image: stimuli/box_candidate_128.png, size: [150, 150], pos: [-110, 0]}
      - {id: cand_3, type: image, if: "$theme == 'video' and task == 'choice'", image: stimuli/box_candidate_128.png, size: [150, 150], pos: [110, 0]}
      - {id: cand_4, type: image, if: "$theme == 'video' and task == 'choice'", image: stimuli/box_candidate_128.png, size: [150, 150], pos: [330, 0]}
      - {id: alert_video, type: image, if: "$theme == 'video'", image: stimuli/box_confirmed_128.png, size: [150, 150], pos: "$[xpos, 0]", start: $delay}
      # every theme: the keys under the boxes, and the response
      - {id: key_labels, type: text, if: "$task == 'choice'", text: "Z                    X                    N                    M", pos: [0, -120], height: 24, color: "#9fe8ff"}
      - {id: resp, type: keyboard, keys: "$['space'] if task == 'simple' else ['z', 'x', 'n', 'm']", correct: $corr_key,
         start: $delay, duration: 2.0, end_routine: true}

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        height: 32
        text: "$'' if resp.corr else ('Too slow' if resp.keys is None else 'Wrong key')"
        color: "#ff3b30"

  ready:
    components:
      - {id: ready_text, type: text, height: 26, color: "#e8f8ff", text: "Practice done. Now the real trials begin.\n\nPress SPACE to start."}
      - {id: ready_key, type: keyboard, keys: [space], end_routine: true}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, height: 30, color: "#9fe8ff", text: "End of the watch. Thank you!"}

flow:
  - simple_intro
  - loop: simple_practice
    conditions: [{task: simple, phase: practice, box: 0, xpos: 0, corr_key: space}]
    repeats: 8
    children: [trial, feedback]
  - ready
  - loop: simple_test
    conditions: [{task: simple, phase: test, box: 0, xpos: 0, corr_key: space}]
    repeats: 20
    children: [trial]
  - choice_intro
  - loop: choice_practice
    conditions: choice_practice.csv
    order: random
    repeats: 2
    children: [trial, feedback]
  - ready
  - loop: choice_test
    conditions: choice_test.csv
    order: random
    repeats: 10
    max_repeat: {box: 3}
    children: [trial]
  - thanks
