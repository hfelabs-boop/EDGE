name: stroop_de_ops
description: >
  Stroop-Aufgabe, operative Fassung (auf Deutsch). German Stroop task, operational adaptation: the same paradigm,
  trial lists, timing, keys (D F J K) and measures as the library's `stroop_de` task, with track affiliation words
  instead of colour words. A label (FEIND, NEUTRAL, FREUND, UNBEKANNT) appears in one of the four affiliation
  colours (red, green, blue, yellow) and the operator presses the key for the label's COLOUR, ignoring the word.
  Half congruent, half incongruent; practice with feedback, then 96 test trials. One variable, `theme`, sets the
  display: c2 (a track label on a tactical plot) or uav (a target tag under the reticle of a camera frame).

# HOW THE THEME SWITCH WORKS (the pattern of search_ops, edge/library/tasks/search_ops/search_ops.yaml)
# `theme` is the first variable (c2 or uav); the label and its colour come from the trial list and are the same in
# every theme; the display around them (plot or camera frame, reticle, telemetry, instructions) are items guarded
# with `if: "$theme == 'uav'"`.

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2              # display theme: c2 or uav
  keys_line: "D = rot (feindlich)    F = grün (neutral)    J = blau (Freund)    K = gelb (unbekannt)"
  cameras: [stimuli/terrain_01_farmland.jpg, stimuli/terrain_05_farmland_ir.jpg]
  # set for every trial by the variable item `show` (these are only starting values, used by the preview)
  camera: stimuli/terrain_01_farmland.jpg
  sensor: EO
  track_no: 417
  alt: 2200
  hdg: 45
  spd: 90

measures:
  - {id: rt, label: Reaktionszeit (richtige Antworten), role: outcome, column: resp.rt, trials: $resp.corr == 1,
     loop: trials, summary: median, units: s, expect: [0.25, 2.0]}
  - {id: accuracy, label: Anteil richtiger Antworten, role: outcome, column: resp.corr, loop: trials, summary: proportion}
  - {id: condition, label: Kongruent oder inkongruent, role: factor, column: condition}

routines:
  instructions:
    components:
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        text: |
          SPURBEZEICHNUNGEN

          Sie beobachten das taktische Lagebild. Jede neue Spur erhält eine farbige Bezeichnung.
          Melden Sie die FARBE der Bezeichnung, nicht das, was das Wort bedeutet.

          D = rot     F = grün     J = blau     K = gelb

          Beispiel: Die Bezeichnung FEIND in blauer Schrift -> Taste J.
          Antworten Sie so schnell wie möglich, aber ohne Fehler.

          Zuerst kommt eine kurze Übung. Weiter mit der LEERTASTE.
        height: 26
        wrap_width: 1100
      - id: text_uav
        type: text
        if: "$theme == 'uav'"
        text: |
          ZIELMARKIERUNGEN

          Sie bedienen die Kamera eines Aufklärungsflugzeugs. Unter dem Fadenkreuz erscheint
          eine farbige Zielmarkierung. Melden Sie die FARBE der Markierung, nicht das, was das Wort bedeutet.

          D = rot     F = grün     J = blau     K = gelb

          Beispiel: Die Markierung FEIND in blauer Schrift -> Taste J.
          Antworten Sie so schnell wie möglich, aber ohne Fehler.

          Zuerst kommt eine kurze Übung. Weiter mit der LEERTASTE.
        height: 26
        wrap_width: 1100
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  trial:
    components:
      - id: show
        type: variable
        set:
          shown_theme: $theme      # puts the theme into every trial's data (column show.shown_theme)
          track_no: "$random.randint(100, 989)"
          camera: "$random.choice(cameras)"
          sensor: "$'IR' if '_ir' in camera else 'EO'"
          alt: "$random.randint(1800, 2600)"
          hdg: "$random.randint(0, 359)"
          spd: "$random.randint(80, 110)"
      # ---- the display around the label, one block per theme ----
      - {id: plot_c2, type: image, if: "$theme == 'c2'", image: stimuli/plot_radar_1280x720.png, size: [1280, 720]}
      - {id: camera_uav, type: image, if: "$theme == 'uav'", image: $camera, size: [1280, 720]}
      - {id: reticle_uav, type: image, if: "$theme == 'uav'", image: stimuli/reticle_brackets.png, size: [240, 240], pos: [0, 150]}
      - {id: tel_uav, type: text, if: "$theme == 'uav'", font: DejaVu Sans Mono, height: 17, color: "#d8ffd8", pos: [-400, 300], text: "$f'ALT {alt} m   HDG {hdg:03d}   SPD {spd} kt'"}
      - {id: tel2_uav, type: text, if: "$theme == 'uav'", font: DejaVu Sans Mono, height: 17, color: "#d8ffd8", pos: [470, 300], text: "$f'SENSOR {sensor}'"}
      - {id: status_bar, type: shape, shape: rect, size: [1280, 40], pos: [0, 340], fill: "#0a2232", opacity: 0.85}
      - {id: status, type: text, font: DejaVu Sans Mono, height: 17, color: "#9fe8ff", pos: [0, 340], text: "$'FARBE DER BEZEICHNUNG MELDEN' if theme == 'c2' else 'FARBE DER MARKIERUNG MELDEN'"}
      # ---- the Stroop stimulus (the same in every theme) ----
      - {id: fix, type: fixation, duration: 0.5, size: 30}
      - {id: plate, type: shape, shape: rect, size: [560, 150], fill: "#04121c", line_color: "#1d4a5e", line_width: 2, opacity: 0.85, start: 0.5}
      - id: stimulus
        type: text
        text: $word
        color: $ink_rgb
        height: 72
        bold: true
        start: 0.5
        pos: [0, 12]
        marker: $f"word_{condition}"
      - {id: track_tag, type: text, font: DejaVu Sans Mono, text: "$f'SPUR {track_no:04d}'", color: "#7f9aa6", height: 18, pos: [0, -48], start: 0.5}
      - {id: reminder_bar, type: shape, shape: rect, size: [1280, 40], pos: [0, -300], fill: "#0a2232", opacity: 0.85}
      - {id: reminder, type: text, text: $keys_line, color: "#9fe8ff", height: 20, pos: [0, -300]}
      - id: resp
        type: keyboard
        keys: [d, f, j, k]
        start: 0.5
        duration: 2.0
        correct: $correct_key
        end_routine: true

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        text: "$'Richtig' if resp.corr == 1 else ('Zu langsam' if resp.keys is None else 'Falsche Taste: die Farbe melden')"
        color: "$'#55dd55' if resp.corr == 1 else '#ff5555'"
        height: 40

  practice_done:
    components:
      - id: text
        type: text
        text: |
          Die Übung ist beendet.

          Jetzt beginnt der eigentliche Test (etwa 4 Minuten).
          Eine Rückmeldung erscheint nur noch nach einem Fehler.
          Die FARBE melden:  D = rot   F = grün   J = blau   K = gelb

          Weiter mit der LEERTASTE.
        height: 28
        wrap_width: 1100
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, text: "Ende der Wache. Vielen Dank!", height: 34}

flow:
  - instructions
  - loop: practice
    conditions: practice.csv
    order: random
    children: [trial, feedback]
  - practice_done
  - loop: trials
    conditions: stroop.csv
    order: random
    repeats: 4
    max_repeat: {ink: 3}
    children:
      - trial
      - {routine: feedback, if: "$resp.corr != 1"}
  - thanks
