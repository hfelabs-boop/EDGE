# Generated by tools/library/make_navon_ops.py: edit the generator (or this file, if you don't regenerate it).
name: navon_ops
description: >
  Navon global/local task, operational adaptation. The same paradigm, design, timing, keys and measures as the
  library's `navon` task, with a formation of track symbols instead of a compound letter: a big (global) DIAMOND or
  SQUARE formation is made of small (local) diamond or square symbols. In the global block the operator reports
  the shape of the FORMATION, in the local block the shape of the SYMBOLS (H key = diamond, S key = square).
  Consistent stimuli have the same shape at both levels, inconsistent ones different shapes. The block order is
  counterbalanced by participant number. One variable, `theme`, sets the display: c2 (a formation of track symbols
  on a radar plot) or uav (a formation of tracker markers in a camera frame).

# HOW THE THEME SWITCH WORKS (the pattern of search_ops, edge/library/tasks/search_ops/search_ops.yaml)
# `theme` is the first variable (c2 or uav). The formation is drawn by 20 shape items (the grid places either
# outline uses), the same in every theme; their colour and the words for the two levels are data per theme
# (`looks`). The display around them (plot or camera frame, reticle, instructions) are items guarded with
# `if: "$theme == 'uav'"`.

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2              # display theme: c2 or uav
  looks:
    c2: {colour: "#00e5ff", global: FORMATION, local: SYMBOLS}
    uav: {colour: "#ffc400", global: FORMATION, local: MARKERS}
  # set for every trial by the variable item `show` (these are only starting values, used by the preview)
  local_size: [20, 20]
  local_ori: 45

measures:
  - {id: rt, label: Reaction time (correct trials), role: outcome, column: resp.rt, trials: $resp.corr == 1,
     loop: trials, summary: median, units: s, expect: [0.25, 2.0]}
  - {id: accuracy, label: Accuracy, role: outcome, column: resp.corr, loop: trials, summary: proportion}
  - {id: level, label: Attend to the formation (global) or the symbols (local), role: factor, column: level}
  - {id: consistency, label: Same or different shape at both levels, role: factor, column: consistency}

routines:
  instructions:
    components:
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        text: |
          FORMATIONS

          You are watching the radar plot. A group of track symbols will appear, flying in a formation.
          The formation has a shape (a big DIAMOND or a big SQUARE), and so does every symbol in it
          (a small diamond or a small square): for example a diamond formation made of small squares.

          Press the H key for DIAMOND (the hostile frame shape) and the S key for SQUARE.

          There are two parts. In one you report the shape of the FORMATION, in the other the shape of the
          SYMBOLS. Before each part you are told which one, and you can practise.

          Keep your eyes on the centre. Press SPACE to continue.
        height: 25
        wrap_width: 1150
      - id: text_uav
        type: text
        if: "$theme == 'uav'"
        text: |
          FORMATIONS

          You are watching the camera of a surveillance aircraft. The image tracker marks a group of objects
          that stand in a formation. The formation has a shape (a big DIAMOND or a big SQUARE), and so does
          every marker in it (a small diamond or a small square).

          Press the H key for DIAMOND and the S key for SQUARE.

          There are two parts. In one you report the shape of the FORMATION, in the other the shape of the
          MARKERS. Before each part you are told which one, and you can practise.

          Keep your eyes on the centre. Press SPACE to continue.
        height: 25
        wrap_width: 1150
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  block_intro:
    components:
      - {id: text, type: text, text: "$instruction.replace('SYMBOLS', looks[theme]['local'])", height: 28, wrap_width: 1100}
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  trial:
    components:
      - id: show
        type: variable
        set:
          shown_theme: $theme      # puts the theme into every trial's data (column show.shown_theme)
          local_size: "$[20, 20] if local_shape == 'diamond' else [24, 24]"
          local_ori: "$45 if local_shape == 'diamond' else 0"
      # ---- the display around the formation, one block per theme ----
      - {id: plot_c2, type: image, if: "$theme == 'c2'", image: stimuli/plot_radar_1280x720.png, size: [1280, 720]}
      - {id: camera_uav, type: image, if: "$theme == 'uav'", image: stimuli/terrain_02_village.jpg, size: [1280, 720]}
      - {id: reticle_uav, type: image, if: "$theme == 'uav'", image: stimuli/reticle_brackets.png, size: [400, 400]}
      - {id: status_bar, type: shape, shape: rect, size: [1280, 40], pos: [0, 340], fill: "#0a2232", opacity: 0.85}
      - {id: status, type: text, font: DejaVu Sans Mono, height: 17, color: "#9fe8ff", pos: [0, 340], text: "$f'REPORT THE SHAPE OF THE {looks[theme][level]}:   H = diamond   S = square'"}
      - {id: fix, type: fixation, duration: 0.5, size: 30}
      # ---- the formation (the same in every theme): 20 grid places, on where `cells` has an x ----
      - {id: c03, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [0, 108], if: "$cells[3] == 'x'", start: 0.5, save: false}
      - {id: c08, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [-72, 72], if: "$cells[8] == 'x'", start: 0.5, save: false}
      - {id: c09, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [-36, 72], if: "$cells[9] == 'x'", start: 0.5, save: false}
      - {id: c10, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [0, 72], if: "$cells[10] == 'x'", start: 0.5, save: false}
      - {id: c11, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [36, 72], if: "$cells[11] == 'x'", start: 0.5, save: false}
      - {id: c12, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [72, 72], if: "$cells[12] == 'x'", start: 0.5, save: false}
      - {id: c15, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [-72, 36], if: "$cells[15] == 'x'", start: 0.5, save: false}
      - {id: c19, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [72, 36], if: "$cells[19] == 'x'", start: 0.5, save: false}
      - {id: c21, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [-108, 0], if: "$cells[21] == 'x'", start: 0.5, save: false}
      - {id: c22, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [-72, 0], if: "$cells[22] == 'x'", start: 0.5, save: false}
      - {id: c26, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [72, 0], if: "$cells[26] == 'x'", start: 0.5, save: false}
      - {id: c27, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [108, 0], if: "$cells[27] == 'x'", start: 0.5, save: false}
      - {id: c29, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [-72, -36], if: "$cells[29] == 'x'", start: 0.5, save: false}
      - {id: c33, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [72, -36], if: "$cells[33] == 'x'", start: 0.5, save: false}
      - {id: c36, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [-72, -72], if: "$cells[36] == 'x'", start: 0.5, save: false}
      - {id: c37, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [-36, -72], if: "$cells[37] == 'x'", start: 0.5, save: false}
      - {id: c38, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [0, -72], if: "$cells[38] == 'x'", start: 0.5, save: false}
      - {id: c39, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [36, -72], if: "$cells[39] == 'x'", start: 0.5, save: false}
      - {id: c40, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [72, -72], if: "$cells[40] == 'x'", start: 0.5, save: false}
      - {id: c45, type: shape, shape: rect, size: $local_size, ori: $local_ori, fill: transparent, line_color: "$looks[theme]['colour']", line_width: 3, pos: [0, -108], if: "$cells[45] == 'x'", start: 0.5, save: false}
      - id: onset
        type: marker
        label: $f"navon_{level}_{consistency}"
        start: 0.5
      - id: resp
        type: keyboard
        keys: [h, s]
        start: 0.5
        duration: 2.0
        correct: "$global_key if level == 'global' else local_key"
        end_routine: true

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        text: "$'Correct' if resp.corr == 1 else ('Too slow' if resp.keys is None else 'Wrong')"
        color: "$'#55dd55' if resp.corr == 1 else '#ff5555'"
        height: 40

  ready:
    components:
      - id: text
        type: text
        text: "$f'Practice finished. Now the test part: report the shape of the {looks[theme][level]}.  Press SPACE to start.'"
        height: 28
        wrap_width: 1100
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, text: "End of the watch. Thank you!", height: 34}

flow:
  - instructions
  - loop: blocks
    order: counterbalance
    conditions:
      - level: global
        instruction: |
          PART: THE FORMATION

          Report the shape of the whole FORMATION and ignore the shape of the SYMBOLS it is made of.
          H key = diamond formation        S key = square formation

          Press SPACE to practise.
      - level: local
        instruction: |
          PART: THE SYMBOLS

          Report the shape of the small SYMBOLS and ignore the shape of the formation they form.
          H key = small diamonds        S key = small squares

          Press SPACE to practise.
    children:
      - block_intro
      - loop: practice
        conditions: stimuli.csv
        order: random
        repeats: 2
        children: [trial, feedback]
      - ready
      - loop: trials
        conditions: stimuli.csv
        order: random
        repeats: 12
        max_repeat: {global_shape: 4, local_shape: 4}
        children:
          - trial
          - {routine: feedback, if: "$resp.corr != 1"}
  - thanks
