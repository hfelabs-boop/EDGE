id: backward_corsi_ops
title: Backward Corsi block-tapping task (operational)
category: Working memory
summary: Tap the waypoints of a route, or the boxes a sensor visited, in reverse order; sequences grow until two of one length fail.
description: >
  The backward Corsi task with operator displays, which adds reordering to spatial memory. Nine places keep the
  classic layout: waypoints on a tactical map grid, or candidate boxes in a surveillance camera picture. They light
  up one per second; the operator taps them in reverse order, starting with the last one. Two practice sequences,
  then two sequences per length starting at 2, growing while at least one is right and stopping when both of a
  length are wrong. Outcomes: backward span and total score (span x correct sequences).
measures:
- backward Corsi span
- number of sequences correct
- total score
- proportion of taps on the right block
- time per tap
duration_min: 6
input: mouse
languages: [en]
variant_of: backward_corsi
domain: defense
themes: [c2, uav]
adaptation: >
  The nine blocks of the classic task become nine places on an operator display, at the same positions, with the
  same ids, sequences, timing, stopping rule and measures. c2: the places are waypoints on a map grid with a
  made-up coastline; a route lights its waypoints in amber one after another, and the operator enters the route
  backwards (as when retracing it). uav: the places are candidate target boxes in a camera frame of a forest seen
  from above; the sensor visits some of them (the box fills in cyan) and the operator taps the path backwards.
  Places, maps and pictures are generic and fictional.
references:
- "Corsi, P. M. (1972). Human memory and the medial temporal region of the brain (Doctoral dissertation). McGill University, Montreal."
- "Kessels, R. P. C., van Zandvoort, M. J. E., Postma, A., Kappelle, L. J., & de Haan, E. H. F. (2000). The Corsi Block-Tapping Task: Standardization and normative data. Applied Neuropsychology, 7(4), 252–258."
- "Isaacs, E. B., & Vargha-Khadem, F. (1989). Differential course of development of spatial and verbal memory span: A normative study. British Journal of Developmental Psychology, 7, 377–380."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/backward_corsi.html"}
notes: >
  The same file as corsi_ops with direction: backward under variables. Switch the display with the variable `theme`
  (c2, uav). Pictures from EDGE's defence kit (tools/library/make_corsi_ops.py).
