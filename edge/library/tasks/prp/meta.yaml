id: prp
title: Psychological refractory period (PRP)
category: Cognitive control
summary: Answer a tone and then a letter that follows it after a variable delay; the second answer slows when the two come close together.
description: >
  Measures the central bottleneck in dual-task performance. Each trial presents two stimuli: a pure tone
  (low 400 Hz or high 900 Hz, 150 ms) 500 ms after a fixation cross, and a letter (X or O) at a stimulus
  onset asynchrony (SOA) of 50, 150, 300, 600 or 1000 ms after the tone. The participant answers the tone
  first with the left hand (A = low, S = high) and then the letter with the right hand (K = X, L = O),
  each within 3 seconds. A short demonstration of the two tones and 10 practice trials with feedback come
  first, then 80 test trials (2 tones x 2 letters x 5 SOAs, 4 times each, in random order), with feedback
  after errors or answers in the wrong order. Main outcome: the PRP effect, the rise of task-2 RT as the
  SOA gets shorter (slope close to -1 at short SOAs), with task-1 RT largely unaffected.
measures:
  - "Median task-2 (letter) RT by SOA (PRP effect)"
  - "Median task-1 (tone) RT by SOA"
  - "Accuracy of both tasks by SOA"
  - "Share of trials answered in the instructed order (check)"
duration_min: 6
input: keyboard
languages: [en]
references:
  - "Welford, A. T. (1952). The 'psychological refractory period' and the timing of high-speed performance: A review and a theory. British Journal of Psychology, 43, 2–19."
  - "Pashler, H. (1994). Dual-task interference in simple tasks: Data and theory. Psychological Bulletin, 116, 220–244."
  - "McCann, R. S., & Johnston, J. C. (1992). Locus of the single-channel bottleneck in dual-task interference. Journal of Experimental Psychology: Human Perception and Performance, 18, 471–484."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/prp.html"}
notes: >
  Needs sound. RTs are counted on trials with both answers correct and in the instructed order
  (order.tone_first). Tone onset timing depends on the computer's audio latency; run a timing test
  (edge timing-test) if exact SOAs matter. Trial lists are made by tools/library/make_prp.py.
