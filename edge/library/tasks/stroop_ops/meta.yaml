id: stroop_ops
title: Stroop task (operational)
category: Inhibition and conflict
summary: Report the colour of a track or target label (HOSTILE, NEUTRAL, FRIENDLY, UNKNOWN) while ignoring what the label says.
description: >
  The library's colour-word Stroop task with operator displays. After a 500 ms fixation cross an affiliation
  label (HOSTILE, NEUTRAL, FRIENDLY or UNKNOWN) appears in one of the four affiliation colours (red, green, blue,
  yellow) and the operator presses the key for the label's colour (r, g, b, y) within 2 seconds. Half of the
  trials are congruent (the word names the affiliation its colour stands for), half incongruent. Eight practice
  trials with feedback are followed by 96 test trials in random order (no more than three of the same colour in a
  row), with feedback only after errors. The Stroop effect is the slowing (and extra errors) on incongruent trials.
measures:
  - "Median RT on correct trials, congruent vs incongruent (Stroop effect)"
  - "Accuracy, congruent vs incongruent"
duration_min: 5
input: keyboard
languages: [en]
variant_of: stroop
domain: defense
themes: [c2, uav]
adaptation: >
  The colour words become affiliation words and the inks become the affiliation colours of the common symbology
  convention (hostile red, neutral green, friendly blue, unknown yellow), so the word names a colour through its
  affiliation: HOSTILE written in red is congruent, HOSTILE written in blue is incongruent. The response is the
  colour, as in the classic task (r, g, b, y). c2: the label is a new track's label on a radar-style tactical
  plot, with a track number under it. uav: the label is a target tag under the reticle of a surveillance
  aircraft's camera frame (daylight or infrared), with telemetry text. Track numbers, places and platforms are
  generic and fictional.
references:
  - "Stroop, J. R. (1935). Studies of interference in serial verbal reactions. Journal of Experimental Psychology, 18, 643–662."
  - "MacLeod, C. M. (1991). Half a century of research on the Stroop effect: An integrative review. Psychological Bulletin, 109, 163–203."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/stroop.html"}
notes: >
  Switch the display with the variable `theme` (c2, uav); it is recorded in every trial (show.shown_theme). The
  trial lists (same design as `stroop`: 24 rows per pass, 50 % congruent) and the pictures (from EDGE's defence
  kit) are made by tools/library/make_stroop_ops.py.
