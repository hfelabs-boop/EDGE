name: ior_ops
description: >
  Inhibition of return, operational adaptation. The same paradigm and measures as the library's `ior` task: one of
  two side places flashes (an uninformative cue), then a contact appears in the cued or the other place after
  100 ms or 800 ms; press SPACE as soon as you see it. On long intervals the centre place flashes in between to pull
  attention back. Detection is faster at the cued place after 100 ms, but slower there after 800 ms (inhibition of
  return). One trial in five has no contact (catch trial). One variable, `theme`, sets the display: c2 (three
  sensor sectors on a radar-style plot; a new unknown air contact) or uav (three candidate boxes in a camera frame;
  a vehicle). All pictures are synthetic and generic (EDGE's defence kit).

# Theme switch as in search_ops: `theme` is the first variable; `looks` maps each theme to its target picture and
# flash colour, and the display around the stimuli (plot and sector frames, camera frame, candidate boxes, reticle,
# instruction texts) is guarded with `if: $theme == ...`. The trial list, timing, key, correct answers and measures
# are the same for every theme (and as in ior).

settings:
  window: {size: [1280, 720], background: "#000000", units: px}
  participant: {participant: "001", session: "1"}

variables:
  theme: c2              # display theme: c2 or uav
  looks:
    c2: {target: stimuli/unknown_air_48.png, size: [48, 48], flash: "#ffb000"}
    uav: {target: stimuli/vehicle_tracked_light.png, size: [56, 56], flash: "#00e5ff"}
  target_name: {c2: contact, uav: vehicle}

measures:
  - {id: rt, label: Detection time, role: outcome, column: resp.rt,
     trials: "$validity != 'catch' and resp.corr == 1", loop: main, summary: mean, units: s, expect: [0.15, 1.0]}
  - {id: accuracy, label: Accuracy (contact detected; on catch trials no press), role: outcome, column: resp.corr, loop: main,
     summary: proportion}
  - {id: validity, label: Cued location (valid / invalid / catch), role: factor, column: validity}
  - {id: ctoa, label: Cue-target interval (s), role: factor, column: ctoa}

routines:
  instructions:
    components:
      - id: text_c2
        type: text
        if: "$theme == 'c2'"
        height: 25
        wrap_width: 1100
        pos: [0, 60]
        text: |
          You are watching three sensor sectors (WEST, CENTRE, EAST) on the air-picture plot.

          Keep your eyes on the centre sector. The sector frames will light up now and then: ignore these
          highlights, they do not tell you where a contact will appear.

          Press SPACE as soon as a new contact (yellow, unknown) appears in the left or right sector.
          Sometimes no contact appears: then do not press.

          First 10 practice trials with feedback. Press SPACE to begin.
      - id: text_uav
        type: text
        if: "$theme == 'uav'"
        height: 25
        wrap_width: 1100
        pos: [0, 60]
        text: |
          You are the payload operator of a surveillance aircraft. The tracker shows three candidate boxes
          on the camera picture: left, centre and right.

          Keep your eyes on the centre box. The boxes will light up now and then: ignore these highlights,
          they do not tell you where a vehicle will appear.

          Press SPACE as soon as a vehicle appears in the left or right box.
          Sometimes no vehicle appears: then do not press.

          First 10 practice trials with feedback. Press SPACE to begin.
      - {id: example_bg, type: shape, shape: rect, size: [140, 140], pos: [0, -260], fill: "#26323a", line_color: "#5a7a8a", line_width: 1}
      - {id: example, type: image, image: "$looks[theme]['target']", size: "$looks[theme]['size']", pos: [0, -260]}
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  main_intro:
    components:
      - id: text
        type: text
        height: 26
        wrap_width: 1050
        text: |
          Practice done. The test has 80 trials (about 4 minutes) without feedback.
          Keep your eyes on the centre.

          Press SPACE to start.
      - {id: go, type: keyboard, keys: [space], end_routine: true}

  trial:
    components:
      - {id: look, type: variable, set: {shown_theme: $theme}}   # puts the theme into every trial's data
      # ---- the display: the three places, one block per theme ----
      - {id: plot_c2, type: image, if: "$theme == 'c2'", image: stimuli/plot_radar_1280x720.png, size: [1280, 720]}
      - {id: box_l_c2, type: shape, if: "$theme == 'c2'", shape: rect, size: [120, 120], pos: [-300, 0], fill: transparent, line_color: "#5aa0c0", line_width: 3}
      - {id: box_c_c2, type: shape, if: "$theme == 'c2'", shape: rect, size: [120, 120], pos: [0, 0], fill: transparent, line_color: "#5aa0c0", line_width: 3}
      - {id: box_r_c2, type: shape, if: "$theme == 'c2'", shape: rect, size: [120, 120], pos: [300, 0], fill: transparent, line_color: "#5aa0c0", line_width: 3}
      - {id: camera_uav, type: image, if: "$theme == 'uav'", image: stimuli/terrain_03_forest.jpg, size: [1280, 720]}
      - {id: box_l_uav, type: image, if: "$theme == 'uav'", image: stimuli/box_candidate_128.png, size: [120, 120], pos: [-300, 0]}
      - {id: box_c_uav, type: image, if: "$theme == 'uav'", image: stimuli/box_candidate_128.png, size: [120, 120], pos: [0, 0]}
      - {id: box_r_uav, type: image, if: "$theme == 'uav'", image: stimuli/box_candidate_128.png, size: [120, 120], pos: [300, 0]}
      - {id: fix, type: text, text: "+", height: 30, color: "#9fe8ff"}
      # peripheral cue: the place on one side lights up for 100 ms (it does not predict the target side)
      - {id: cue, type: shape, shape: rect, size: [134, 134], pos: "$[cue_x, 0]", fill: transparent,
         line_color: "$looks[theme]['flash']", line_width: 9, start: 1.0, duration: 0.1, marker: "$f'cue_{cue_side}'"}
      # long intervals only: the centre place lights up 300 ms after the cue to draw attention back to fixation
      - {id: recue, type: shape, shape: rect, size: [134, 134], pos: [0, 0], fill: transparent,
         line_color: "$looks[theme]['flash']", line_width: 9, start: 1.3, duration: 0.1, if: "$ctoa > 0.5"}
      - {id: target, type: image, image: "$looks[theme]['target']", size: "$looks[theme]['size']", pos: "$[target_x, 0]",
         start: $1.0 + ctoa, if: "$validity != 'catch'", marker: "$f'target_{validity}'"}
      - {id: resp, type: keyboard, keys: [space], correct: $correct_key, start: $1.0 + ctoa, duration: 1.2,
         end_routine: true}

  feedback:
    duration: 0.8
    components:
      - id: fb
        type: text
        height: 30
        text: >-
          $('Correct' if resp.corr else 'Missed - press when the ' + target_name[theme] + ' appears') if validity != 'catch'
          else ('Correct - there was nothing' if resp.corr else 'There was nothing this time')
        color: "$'#34c759' if resp.corr else '#ff3b30'"

  iti:
    components:
      - {id: blank, type: wait, duration: 0.6}

  thanks:
    duration: 3
    components:
      - {id: bye, type: text, height: 30, text: "End of the watch. Thank you!"}

flow:
  - instructions
  - loop: practice
    conditions: ior_ops.csv
    order: random
    stop_if: $practice.n >= 9
    children: [trial, feedback]
  - main_intro
  - loop: main
    conditions: ior_ops.csv
    order: random
    repeats: 4
    children: [trial, iti]
  - thanks
