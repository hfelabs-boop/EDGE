id: simon_ops
title: Simon task (operational)
category: Inhibition and conflict
summary: Classify a contact that appears left or right of the centre (friendly or hostile track, wheeled or tracked vehicle) with the left or right hand, ignoring where it appears.
description: >
  The library's Simon task with operator displays. A fixation cross (own ship or the reticle) stays in the
  centre; 500 ms after it appears a contact is shown 350 px left or right of it, and the operator presses A (left
  hand) for one kind of contact and L (right hand) for the other within 1.5 seconds. When the contact is on the
  same side as the correct key the trial is congruent, otherwise incongruent. The four kind x side combinations are
  balanced: 8 practice trials with feedback, then 80 test trials in random order (at most four of the same kind or
  side in a row), with feedback after errors and a 500 ms pause between trials. Main outcome: the Simon effect,
  slower and less accurate responses on incongruent trials.
measures:
  - "Median RT on correct trials, congruent vs incongruent (Simon effect)"
  - "Accuracy, congruent vs incongruent"
duration_min: 4
input: keyboard
languages: [en]
variant_of: simon
domain: defense
themes: [c2, uav]
adaptation: >
  The blue and orange circles become two kinds of contact; their place (left or right of the centre) is the
  irrelevant spatial dimension, as in the classic task. c2: on a radar-style plot around own ship (the centre
  cross) a friendly air track (blue rectangle frame; the classic blue, A) or a hostile air track (red diamond
  frame; the classic orange, L) appears left or right. uav: in a surveillance camera frame (daylight or
  infrared) with a reticle at the centre and telemetry text, a light wheeled vehicle (A) or a light tracked
  vehicle (L) appears left or right of the reticle. All generic and fictional.
references:
  - "Simon, J. R., & Wolf, J. D. (1963). Choice reaction times as a function of angular stimulus-response correspondence and age. Ergonomics, 6, 99–105."
  - "Hommel, B. (1993). Inverting the Simon effect by intention: Determinants of direction and extent of effects of irrelevant spatial information. Psychological Research, 55, 270–279."
see_also: {psytoolkit: "https://www.psytoolkit.org/experiment-library/simon.html"}
notes: >
  Switch the display with the variable `theme` (c2, uav); the picture shown is saved as show.contact. The trial
  list is the classic task's (colour blue / orange stands for the two kinds of contact), copied with the kit
  pictures by tools/library/make_simon_ops.py. The kind-to-hand mapping is fixed; swap correct_key in trials.csv
  to counterbalance it.
