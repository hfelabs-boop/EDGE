name: corsi2
description: >
  Corsi block-tapping task, adaptive version. Nine blocks sit at fixed places on a dark board (the same
  layout for everyone). Some of them light up one after another (one per second); the participant then
  taps or clicks the same blocks in the same order. The sequence length follows a one-up/one-down
  staircase: one block longer after a correct sequence, one shorter after an error, for 14 sequences.
  The span estimate is the mean length at the staircase's turning points; the longest sequence
  reproduced is recorded as well.

settings:
  window: {size: [1280, 720], background: "#101418", units: px}
  participant: {participant: "001", session: "1"}

variables:
  direction: forward
  light_on: 0.75          # seconds a block stays lit
  light_soa: 1.0          # seconds from one block to the next
  # centres of blocks 1-9 (the layout is fixed for everyone; move blocks here and in the screens below)
  blocks: [[-380, 180], [-120, 235], [210, 190], [410, 60], [-290, 10], [40, 45], [-420, -180], [-90, -150], [260, -205]]
  span: 2                 # practice length; inside the adaptive run the staircase sets 'span'
  best: 0
  n_correct_seqs: 0
  seq: []
  target: []
  n_ok: 0
  seq_ok: 0
  phase: practice

measures:
  - {id: span_estimate, label: Span estimate (mean length at the turning points), role: outcome,
     column: final.span_estimate, summary: last, expect: [2, 9]}
  - {id: longest, label: Longest sequence reproduced, role: outcome, column: score.best,
     trials: "$phase == 'main'", summary: last, expect: [0, 9]}
  - {id: sequences_correct, label: Proportion of sequences reproduced, role: outcome, column: score.seq_ok,
     trials: "$phase == 'main'", summary: proportion}
  - {id: block_accuracy, label: Taps on the right block, role: outcome, column: pad.corr, trials: "$phase == 'main'",
     summary: proportion}
  - {id: tap_rt, label: Time per tap, role: outcome, column: pad.rt, trials: "$phase == 'main'", summary: median,
     units: s, expect: [0.15, 10]}
  - {id: seq_length, label: Sequence length, role: factor, column: span}

routines:
  instructions:
    components:
      - id: text
        type: text
        height: 27
        wrap_width: 1050
        text: |
          Block tapping

          You will see nine blue blocks. Some of them will light up in yellow, one after another.
          Watch carefully. When the blocks stop lighting up, tap or click the same blocks
          in the SAME order.

          The sequences get longer when you are right and shorter when you make a mistake.
          First, two practice sequences. Click anywhere to start.
      - {id: go, type: mouse, end_routine: true}

  start_main:
    duration: 0.5
    components:
      - {id: set_phase, type: variable, set: {phase: main}}
      - {id: blank, type: wait}

  main_intro:
    components:
      - id: text
        type: text
        height: 27
        wrap_width: 1050
        text: |
          Good. Now the test begins: 14 sequences. A sequence is one block longer after a correct
          answer and one block shorter after a mistake.
          There is no feedback from now on.

          Click anywhere to start.
      - {id: go, type: mouse, end_routine: true}

  new_sequence:
    duration: 1.0
    components:
      - id: make
        type: variable
        set:
          seq: "$random.sample(range(1, 10), int(span))"
          n_ok: 0
          i_show: 0
          i_rec: 0
      - id: order
        type: variable
        set: {target: "$list(seq) if direction == 'forward' else list(seq[::-1])"}
      - {id: board, type: shape, shape: rect, size: [1000, 560], pos: [0, 15], fill: "#2a3038", line_color: "#4a525e", line_width: 3}
      - {id: b1, type: shape, shape: rect, size: [90, 90], pos: [-380, 180], fill: "#3d7bd9"}
      - {id: b2, type: shape, shape: rect, size: [90, 90], pos: [-120, 235], fill: "#3d7bd9"}
      - {id: b3, type: shape, shape: rect, size: [90, 90], pos: [210, 190], fill: "#3d7bd9"}
      - {id: b4, type: shape, shape: rect, size: [90, 90], pos: [410, 60], fill: "#3d7bd9"}
      - {id: b5, type: shape, shape: rect, size: [90, 90], pos: [-290, 10], fill: "#3d7bd9"}
      - {id: b6, type: shape, shape: rect, size: [90, 90], pos: [40, 45], fill: "#3d7bd9"}
      - {id: b7, type: shape, shape: rect, size: [90, 90], pos: [-420, -180], fill: "#3d7bd9"}
      - {id: b8, type: shape, shape: rect, size: [90, 90], pos: [-90, -150], fill: "#3d7bd9"}
      - {id: b9, type: shape, shape: rect, size: [90, 90], pos: [260, -205], fill: "#3d7bd9"}
      - {id: watch, type: text, text: Watch, pos: [0, -320], height: 26, color: "#bbbbbb"}

  # one lit block; the loop 'show' runs once per block of the sequence
  light:
    duration: $light_soa
    components:
      - {id: board, type: shape, shape: rect, size: [1000, 560], pos: [0, 15], fill: "#2a3038", line_color: "#4a525e", line_width: 3}
      - {id: b1, type: shape, shape: rect, size: [90, 90], pos: [-380, 180], fill: "#3d7bd9"}
      - {id: b2, type: shape, shape: rect, size: [90, 90], pos: [-120, 235], fill: "#3d7bd9"}
      - {id: b3, type: shape, shape: rect, size: [90, 90], pos: [210, 190], fill: "#3d7bd9"}
      - {id: b4, type: shape, shape: rect, size: [90, 90], pos: [410, 60], fill: "#3d7bd9"}
      - {id: b5, type: shape, shape: rect, size: [90, 90], pos: [-290, 10], fill: "#3d7bd9"}
      - {id: b6, type: shape, shape: rect, size: [90, 90], pos: [40, 45], fill: "#3d7bd9"}
      - {id: b7, type: shape, shape: rect, size: [90, 90], pos: [-420, -180], fill: "#3d7bd9"}
      - {id: b8, type: shape, shape: rect, size: [90, 90], pos: [-90, -150], fill: "#3d7bd9"}
      - {id: b9, type: shape, shape: rect, size: [90, 90], pos: [260, -205], fill: "#3d7bd9"}
      - {id: lit, type: shape, shape: rect, size: [90, 90], pos: "$blocks[seq[i_show] - 1]", fill: "#ffd23f",
         duration: $light_on, marker: "$f'block_{seq[i_show]}'"}
      - {id: step, type: variable, when: end, set: {i_show: "$i_show + 1"}}
      - {id: watch, type: text, text: Watch, pos: [0, -320], height: 26, color: "#bbbbbb"}

  # one tap; the answer for this position is target[i_rec]
  tap:
    components:
      - {id: board, type: shape, shape: rect, size: [1000, 560], pos: [0, 15], fill: "#2a3038", line_color: "#4a525e", line_width: 3}
      - {id: b1, type: shape, shape: rect, size: [90, 90], pos: [-380, 180], fill: "#3d7bd9"}
      - {id: b2, type: shape, shape: rect, size: [90, 90], pos: [-120, 235], fill: "#3d7bd9"}
      - {id: b3, type: shape, shape: rect, size: [90, 90], pos: [210, 190], fill: "#3d7bd9"}
      - {id: b4, type: shape, shape: rect, size: [90, 90], pos: [410, 60], fill: "#3d7bd9"}
      - {id: b5, type: shape, shape: rect, size: [90, 90], pos: [-290, 10], fill: "#3d7bd9"}
      - {id: b6, type: shape, shape: rect, size: [90, 90], pos: [40, 45], fill: "#3d7bd9"}
      - {id: b7, type: shape, shape: rect, size: [90, 90], pos: [-420, -180], fill: "#3d7bd9"}
      - {id: b8, type: shape, shape: rect, size: [90, 90], pos: [-90, -150], fill: "#3d7bd9"}
      - {id: b9, type: shape, shape: rect, size: [90, 90], pos: [260, -205], fill: "#3d7bd9"}
      - id: prompt
        type: text
        pos: [0, -320]
        height: 26
        color: "#ffffff"
        text: "$f\"Your turn: tap the blocks {'in the same order' if direction == 'forward' else 'in REVERSE order'} ({i_rec + 1} of {int(span)})\""
      - id: pad
        type: mouse
        clickable: [b1, b2, b3, b4, b5, b6, b7, b8, b9]
        correct: "$f'b{target[i_rec]}'"
        end_routine: true
      - id: note
        type: variable
        when: end
        set: {n_ok: "$n_ok + (pad.corr or 0)", i_rec: "$i_rec + 1"}

  # the tapped block flashes briefly so the participant sees the tap was taken
  echo:
    duration: 0.25
    components:
      - {id: board, type: shape, shape: rect, size: [1000, 560], pos: [0, 15], fill: "#2a3038", line_color: "#4a525e", line_width: 3}
      - {id: b1, type: shape, shape: rect, size: [90, 90], pos: [-380, 180], fill: "#3d7bd9"}
      - {id: b2, type: shape, shape: rect, size: [90, 90], pos: [-120, 235], fill: "#3d7bd9"}
      - {id: b3, type: shape, shape: rect, size: [90, 90], pos: [210, 190], fill: "#3d7bd9"}
      - {id: b4, type: shape, shape: rect, size: [90, 90], pos: [410, 60], fill: "#3d7bd9"}
      - {id: b5, type: shape, shape: rect, size: [90, 90], pos: [-290, 10], fill: "#3d7bd9"}
      - {id: b6, type: shape, shape: rect, size: [90, 90], pos: [40, 45], fill: "#3d7bd9"}
      - {id: b7, type: shape, shape: rect, size: [90, 90], pos: [-420, -180], fill: "#3d7bd9"}
      - {id: b8, type: shape, shape: rect, size: [90, 90], pos: [-90, -150], fill: "#3d7bd9"}
      - {id: b9, type: shape, shape: rect, size: [90, 90], pos: [260, -205], fill: "#3d7bd9"}
      - {id: flash, type: shape, shape: rect, size: [90, 90], fill: "#9fd0ff",
         pos: "$blocks[int(pad.clicked[1:]) - 1] if pad.clicked else [0, -500]"}

  result:
    duration: "$1.5 if phase == 'practice' else 0.8"
    components:
      - id: score
        type: variable
        set:
          seq_ok: "$int(n_ok == int(span))"
          best: "$max(best, int(span)) if n_ok == int(span) and phase == 'main' else best"
          n_correct_seqs: "$n_correct_seqs + (1 if n_ok == int(span) and phase == 'main' else 0)"
      - id: fb
        type: text
        height: 34
        text: "$('Correct!' if n_ok == int(span) else 'Not quite.') if phase == 'practice' else ''"
        color: "$'#5fd38d' if n_ok == int(span) else '#ff7a7a'"

  thanks:
    duration: 4
    components:
      - id: final
        type: variable
        set: {span_estimate: "$round(adaptive_threshold, 2) if adaptive_threshold is not None else None"}
      - {id: bye, type: text, height: 32, text: "$f'Thank you! Longest sequence you reproduced: {best}'"}

flow:
  - instructions
  - loop: practice
    repeats: 2
    children:
      - new_sequence
      - loop: show
        repeats: $span
        children: [light]
      - loop: recall
        repeats: $span
        children: [tap, echo]
      - result
  - main_intro
  - start_main
  # adaptive length, starting at 3 blocks: +1 block after a correct sequence, -1 after an error
  # (step -1: a "correct" step makes the task harder, i.e. longer); 14 sequences
  - loop: adaptive
    staircase: {variable: span, start: 3, step: -1, up: 1, down: 1, min: 2, max: 9, reversals: 99,
                max_trials: 14, correct: seq_ok}
    children:
      - new_sequence
      - loop: show
        repeats: $int(span)
        children: [light]
      - loop: recall
        repeats: $int(span)
        children: [tap, echo]
      - result
  - thanks
